name: Qwen Live Beta Verification

on:
  workflow_dispatch:
    inputs:
      run_marker_chat_live:
        description: Run marker chat live route smoke after owner-config provider verification
        required: false
        default: 'true'

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      REEDITPRO_QWEN_RUNTIME_MODE: beta_enabled
      GOOGLE_CLOUD_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      QWEN_REASONING_API_KEY_SECRET: ${{ vars.QWEN_REASONING_API_KEY_SECRET }}
      QWEN_REASONING_BASE_URL: ${{ vars.QWEN_REASONING_BASE_URL }}
      QWEN_REASONING_BASE_URL_SECRET: ${{ vars.QWEN_REASONING_BASE_URL_SECRET }}
      QWEN_REASONING_MODEL_ID: ${{ vars.QWEN_REASONING_MODEL_ID }}
      QWEN_REASONING_MODEL_ID_SECRET: ${{ vars.QWEN_REASONING_MODEL_ID_SECRET }}
      QWEN_REASONING_TRANSPORT_PROFILE: ${{ vars.QWEN_REASONING_TRANSPORT_PROFILE }}
      QWEN_REASONING_REQUEST_PATH: ${{ vars.QWEN_REASONING_REQUEST_PATH }}
      QWEN_REASONING_TIMEOUT_MS: ${{ vars.QWEN_REASONING_TIMEOUT_MS }}
      QWEN_REASONING_MAX_RETRIES: ${{ vars.QWEN_REASONING_MAX_RETRIES }}
      API_ALLOW_MOCK_WITHOUT_SUPABASE: 'true'
      E2E_RUNTIME_MODE: mock
      STORAGE_MODE: local
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Authenticate to Google Cloud for Secret Manager
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --progress=false

      - name: Check Qwen beta env unlock gates
        run: npm run unlock:qwen-beta:strict

      - name: Run Qwen beta doctor
        run: npm run doctor:qwen-beta:strict

      - name: Run live owner-config provider smoke
        run: npm run smoke:qwen-live-owner-config

      - name: Run live Marker Chat route smoke
        if: ${{ inputs.run_marker_chat_live == 'true' }}
        run: npm run smoke:qwen-marker-chat-live

      - name: Run static Qwen safety checks
        run: |
          npm run check:qwen-runtime-boundary
          npm run check:qwen-secret-leakage
