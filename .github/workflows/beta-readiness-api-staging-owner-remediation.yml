name: Beta Readiness API Staging Owner Remediation

on:
  workflow_dispatch:
    inputs:
      confirm_staging_api_owner_remediation:
        description: "Type APPLY_STAGING_BETA_API_OWNER_REMEDIATION to mutate only staging API IAM/service-account prerequisites"
        required: true
        type: string
      confirm_iam_mutation_scope:
        description: "Type MUTATE_STAGING_IAM_ONLY to confirm this is not deploy/build/runtime execution"
        required: true
        type: string
      artifact_region:
        description: "Artifact Registry region; must be us-central1 for this first staging API lane"
        required: true
        type: string
      artifact_repository:
        description: "Artifact Registry repository; must be reeditpro-staging-workers"
        required: true
        type: string
      deployer_service_account:
        description: "Deployer service account; must match the repo-configured GCP service account"
        required: true
        type: string
      runtime_service_account:
        description: "Runtime service account; must be reeditpro-api-staging@reeditpro.iam.gserviceaccount.com"
        required: true
        type: string
      service_name:
        description: "Staging service name; must be reeditpro-api-staging"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: beta-readiness-api-staging-owner-remediation
  cancel-in-progress: false

jobs:
  remediate-staging-api-owner-inputs:
    name: Apply exact staging API owner remediation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ secrets.GCP_REGION || vars.GCP_REGION }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER || vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT || vars.GCP_SERVICE_ACCOUNT }}
      CONFIRM_OWNER_REMEDIATION: ${{ inputs.confirm_staging_api_owner_remediation }}
      CONFIRM_IAM_MUTATION_SCOPE: ${{ inputs.confirm_iam_mutation_scope }}
      ARTIFACT_REGION: ${{ inputs.artifact_region }}
      ARTIFACT_REPOSITORY: ${{ inputs.artifact_repository }}
      DEPLOYER_SERVICE_ACCOUNT: ${{ inputs.deployer_service_account }}
      RUNTIME_SERVICE_ACCOUNT: ${{ inputs.runtime_service_account }}
      SERVICE_NAME: ${{ inputs.service_name }}
    steps:
      - name: Fail closed unless this is exact staging owner remediation
        shell: bash
        run: |
          set -euo pipefail
          test "${CONFIRM_OWNER_REMEDIATION}" = "APPLY_STAGING_BETA_API_OWNER_REMEDIATION"
          test "${CONFIRM_IAM_MUTATION_SCOPE}" = "MUTATE_STAGING_IAM_ONLY"
          test "${GCP_PROJECT_ID}" = "reeditpro"
          test "${GCP_REGION}" = "us-east1"
          test -n "${GCP_WORKLOAD_IDENTITY_PROVIDER}"
          test -n "${GCP_SERVICE_ACCOUNT}"
          test "${ARTIFACT_REGION}" = "us-central1"
          test "${ARTIFACT_REPOSITORY}" = "reeditpro-staging-workers"
          test "${DEPLOYER_SERVICE_ACCOUNT}" = "${GCP_SERVICE_ACCOUNT}"
          test "${RUNTIME_SERVICE_ACCOUNT}" = "reeditpro-api-staging@reeditpro.iam.gserviceaccount.com"
          test "${SERVICE_NAME}" = "reeditpro-api-staging"

      - name: Authenticate to Google Cloud with OIDC/WIF
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
          cleanup_credentials: true

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Apply staging API IAM and runtime account prerequisites
        shell: bash
        run: |
          set -euo pipefail
          runtime_account_id="${RUNTIME_SERVICE_ACCOUNT%@*}"
          results_file="${RUNNER_TEMP}/staging-api-owner-remediation-results.tsv"
          failures_file="${RUNNER_TEMP}/staging-api-owner-remediation-failures.txt"
          : > "${results_file}"
          : > "${failures_file}"

          sanitize_gcloud_log() {
            sed -E \
              -e 's#authenticated as [^ ]+#authenticated as <redacted>#g' \
              -e 's#/home/runner/work/[^ ]*/gha-creds-[^ ,]+#<github-oidc-credential-file>#g' \
              -e 's#gha-creds-[A-Za-z0-9._-]+\\.json#<github-oidc-credential-file>#g'
          }

          record_result() {
            local name="$1"
            local status="$2"
            local exit_code="$3"
            printf '%s\t%s\t%s\n' "${name}" "${status}" "${exit_code}" >> "${results_file}"
          }

          run_required_command() {
            local name="$1"
            shift
            local stdout_file="${RUNNER_TEMP}/${name}.stdout"
            local stderr_file="${RUNNER_TEMP}/${name}.stderr"

            echo "::group::${name}"
            set +e
            "$@" >"${stdout_file}" 2>"${stderr_file}"
            local exit_code=$?
            set -e

            if [ "${exit_code}" -eq 0 ]; then
              record_result "${name}" "success" "0"
              echo "${name}: success"
            else
              record_result "${name}" "failure" "${exit_code}"
              printf '%s\n' "${name}" >> "${failures_file}"
              echo "${name}: failure (${exit_code})"
              {
                echo "stdout:"
                sanitize_gcloud_log < "${stdout_file}" | tail -40
                echo "stderr:"
                sanitize_gcloud_log < "${stderr_file}" | tail -80
              }
            fi
            echo "::endgroup::"
          }

          run_required_command artifact_registry_writer_binding \
            gcloud artifacts repositories add-iam-policy-binding "${ARTIFACT_REPOSITORY}" \
            --project="${GCP_PROJECT_ID}" \
            --location="${ARTIFACT_REGION}" \
            --member="serviceAccount:${DEPLOYER_SERVICE_ACCOUNT}" \
            --role=roles/artifactregistry.writer

          if ! gcloud iam service-accounts describe "${RUNTIME_SERVICE_ACCOUNT}" --project="${GCP_PROJECT_ID}" >/dev/null 2>&1; then
            run_required_command runtime_service_account_create \
              gcloud iam service-accounts create "${runtime_account_id}" \
              --project="${GCP_PROJECT_ID}" \
              --display-name="ReEditPro API staging runtime"
          else
            record_result runtime_service_account_create "already_exists" "0"
            echo "runtime_service_account_create: already_exists"
          fi

          run_required_command deployer_act_as_runtime_binding \
            gcloud iam service-accounts add-iam-policy-binding "${RUNTIME_SERVICE_ACCOUNT}" \
            --project="${GCP_PROJECT_ID}" \
            --member="serviceAccount:${DEPLOYER_SERVICE_ACCOUNT}" \
            --role=roles/iam.serviceAccountUser

          run_required_command cloud_run_admin_binding \
            gcloud projects add-iam-policy-binding "${GCP_PROJECT_ID}" \
            --member="serviceAccount:${DEPLOYER_SERVICE_ACCOUNT}" \
            --role=roles/run.admin

          for secret_name in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY PROVIDER_GATEWAY_SHARED_SECRET WORKER_WEBHOOK_SECRET; do
            run_required_command "runtime_secret_accessor_${secret_name}" \
              gcloud secrets add-iam-policy-binding "${secret_name}" \
              --project="${GCP_PROJECT_ID}" \
              --member="serviceAccount:${RUNTIME_SERVICE_ACCOUNT}" \
              --role=roles/secretmanager.secretAccessor
          done

          {
            echo '# Beta Readiness API Staging Owner Remediation Attempts'
            echo ''
            echo '| prerequisite | status | exit code |'
            echo '| --- | --- | --- |'
            awk -F '\t' '{ printf "| `%s` | `%s` | `%s` |\n", $1, $2, $3 }' "${results_file}"
            echo ''
            echo 'This workflow still fails closed unless every required prerequisite and exact input verification passes.'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Verify exact staging API owner remediation inputs
        shell: bash
        run: |
          set -euo pipefail
          results_file="${RUNNER_TEMP}/staging-api-owner-remediation-results.tsv"
          failures_file="${RUNNER_TEMP}/staging-api-owner-remediation-failures.txt"
          verification_failures=0
          repository_name=""
          runtime_email=""

          if repository_name="$(gcloud artifacts repositories describe "${ARTIFACT_REPOSITORY}" \
            --project="${GCP_PROJECT_ID}" \
            --location="${ARTIFACT_REGION}" \
            --format='value(name)')"; then
            if [ "${repository_name}" != "projects/${GCP_PROJECT_ID}/locations/${ARTIFACT_REGION}/repositories/${ARTIFACT_REPOSITORY}" ]; then
              echo "Artifact Registry repository mismatch: ${repository_name}"
              verification_failures=$((verification_failures + 1))
            fi
          else
            echo "Artifact Registry repository verification failed."
            verification_failures=$((verification_failures + 1))
          fi

          if runtime_email="$(gcloud iam service-accounts describe "${RUNTIME_SERVICE_ACCOUNT}" \
            --project="${GCP_PROJECT_ID}" \
            --format='value(email)')"; then
            if [ "${runtime_email}" != "${RUNTIME_SERVICE_ACCOUNT}" ]; then
              echo "Runtime service account mismatch: ${runtime_email}"
              verification_failures=$((verification_failures + 1))
            fi
          else
            echo "Runtime service account verification failed."
            verification_failures=$((verification_failures + 1))
          fi

          apply_failures=0
          if [ -s "${failures_file}" ]; then
            apply_failures="$(wc -l < "${failures_file}" | tr -d ' ')"
          fi

          status="failed"
          if [ "${apply_failures}" -eq 0 ] && [ "${verification_failures}" -eq 0 ]; then
            status="completed"
          fi
          {
            echo '# Beta Readiness API Staging Owner Remediation'
            echo ''
            echo "Exact staging API owner remediation ${status}."
            echo ''
            echo "- Artifact Registry repository: ${repository_name:-not verified}"
            echo "- Runtime service account: ${runtime_email:-not verified}"
            echo "- Prerequisite command failures: ${apply_failures}"
            echo "- Verification failures: ${verification_failures}"
            echo ''
            echo '| prerequisite | status | exit code |'
            echo '| --- | --- | --- |'
            awk -F '\t' '{ printf "| `%s` | `%s` | `%s` |\n", $1, $2, $3 }' "${results_file}"
            echo ''
            echo 'No Cloud Run deploy, Docker build/push, evidence collector, tool execution, media processing, Supabase/GCS write, external beta, or production action was run by this workflow.'
          } >> "${GITHUB_STEP_SUMMARY}"

          if [ "${status}" != "completed" ]; then
            exit 1
          fi
