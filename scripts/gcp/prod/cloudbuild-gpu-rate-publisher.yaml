steps:
  - name: gcr.io/cloud-builders/docker@sha256:f8b08c609fdc392ee6827ff3e1725e4980f7d96bde9f76f4695086405c96c147
    id: build-source-bound-gpu-rate-publisher
    args:
      - build
      - --pull=false
      - --no-cache
      - --platform=linux/amd64
      - --file=docker/prod/gpu-rate-publisher/Dockerfile
      - --tag=${_IMAGE}
      - --build-arg=WEEDITPRO_SOURCE_COMMIT_SHA=${_SOURCE_COMMIT_SHA}
      - --build-arg=WEEDITPRO_SOURCE_TREE_HASH=${_SOURCE_TREE_HASH}
      - --build-arg=WEEDITPRO_SOURCE_CLEAN=true
      - .
images:
  - ${_IMAGE}
timeout: 2400s
queueTtl: 600s
serviceAccount: projects/reeditpro/serviceAccounts/reeditpro-image-builder-sa@reeditpro.iam.gserviceaccount.com
options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: '100'
  logging: CLOUD_LOGGING_ONLY
  requestedVerifyOption: VERIFIED
  sourceProvenanceHash:
    - SHA256
tags:
  - weeditpro
  - a100
  - l4
  - account-effective-price
  - publisher
  - control-plane-only
