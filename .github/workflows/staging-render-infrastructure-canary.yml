name: RP E2E Staging Cloud Run Remotion Render Infrastructure Canary

on:
  workflow_dispatch:
    inputs:
      allow_writes:
        description: "Required safety gate for smoke-tagged staging writes"
        required: true
        default: false
        type: boolean
      allow_render_execution:
        description: "Required safety gate for staging render infrastructure execution"
        required: true
        default: false
        type: boolean
      allow_cloud_run:
        description: "Required only for the staging Cloud Run canary path"
        required: true
        default: false
        type: boolean
      allow_remotion:
        description: "Required only for the staging Remotion canary path"
        required: true
        default: false
        type: boolean
      cleanup:
        description: "Cleanup is required for this gate"
        required: true
        default: true
        type: boolean
      max_wait_seconds:
        description: "Maximum bounded wait for the infrastructure canary"
        required: true
        default: 180
        type: number
      smoke_user_id:
        description: "Existing safe staging Supabase auth user id"
        required: true
        type: string
      previous_write_smoke_run_id:
        description: "Previous write/read/cleanup smoke run id to verify no leftovers"
        required: true
        type: string
      previous_persisted_render_smoke_run_id:
        description: "Previous persisted render metadata smoke run id to verify no leftovers"
        required: true
        type: string
      previous_sandbox_render_smoke_run_id:
        description: "Previous local FFmpeg sandbox render smoke run id to verify no leftovers"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  staging-render-infrastructure-canary:
    name: Staging Cloud Run Remotion render infrastructure canary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API_ALLOW_MOCK_WITHOUT_SUPABASE: "false"
      E2E_RUNTIME_MODE: cloud_run
      WORKER_RUNTIME_MODE: cloud_run
      STORAGE_MODE: gcs
      SUPABASE_E2E_SMOKE_MODE: live
      SUPABASE_E2E_ALLOW_WRITES: ${{ inputs.allow_writes && 'true' || 'false' }}
      SUPABASE_E2E_ALLOW_RENDER_EXECUTION: ${{ inputs.allow_render_execution && 'true' || 'false' }}
      SUPABASE_E2E_ALLOW_CLOUD_RUN: ${{ inputs.allow_cloud_run && 'true' || 'false' }}
      SUPABASE_E2E_ALLOW_REMOTION: ${{ inputs.allow_remotion && 'true' || 'false' }}
      SUPABASE_E2E_CLEANUP: ${{ inputs.cleanup && 'true' || 'false' }}
      SUPABASE_E2E_MAX_WAIT_SECONDS: ${{ inputs.max_wait_seconds }}
      SUPABASE_E2E_PREVIOUS_WRITE_SMOKE_RUN_ID: ${{ inputs.previous_write_smoke_run_id }}
      SUPABASE_E2E_PREVIOUS_SMOKE_RUN_ID: ${{ inputs.previous_write_smoke_run_id }}
      SUPABASE_E2E_PREVIOUS_PERSISTED_RENDER_SMOKE_RUN_ID: ${{ inputs.previous_persisted_render_smoke_run_id }}
      SUPABASE_E2E_PREVIOUS_SANDBOX_RENDER_SMOKE_RUN_ID: ${{ inputs.previous_sandbox_render_smoke_run_id }}
      SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_E2E_USER_ID: ${{ inputs.smoke_user_id }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GOOGLE_CLOUD_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_REGION: ${{ secrets.GCP_REGION }}
      GOOGLE_CLOUD_REGION: ${{ secrets.GCP_REGION }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      STAGING_RENDER_CANARY_MODE: staging_cloud_run_remotion_canary
      STAGING_RENDER_CANARY_CLOUD_RUN_URL: ${{ secrets.STAGING_RENDER_CANARY_CLOUD_RUN_URL }}
      STAGING_RENDER_CANARY_CLOUD_RUN_AUDIENCE: ${{ secrets.STAGING_RENDER_CANARY_CLOUD_RUN_AUDIENCE }}
      STAGING_RENDER_CANARY_OUTPUT_BUCKET_OR_PREFIX: ${{ secrets.STAGING_RENDER_CANARY_OUTPUT_BUCKET_OR_PREFIX }}
      STAGING_RENDER_CANARY_EXPECTED_HOST_SUFFIX: ".run.app"
      STAGING_RENDER_CANARY_DURATION_SECONDS: "3"
      STAGING_RENDER_CANARY_WIDTH: "160"
      STAGING_RENDER_CANARY_HEIGHT: "90"
      STAGING_RENDER_CANARY_FPS: "15"
      STAGING_RENDER_CANARY_MAX_RETRIES: "0"
      STAGING_RENDER_CANARY_CONCURRENCY: "1"
      STAGING_RENDER_CANARY_TIMEOUT_SECONDS: "120"
    steps:
      - name: Require explicit staging write approval
        if: ${{ !inputs.allow_writes }}
        run: |
          echo "::error::Set allow_writes=true only after prior staging smoke gates pass."
          exit 1

      - name: Require explicit render execution approval
        if: ${{ !inputs.allow_render_execution }}
        run: |
          echo "::error::Set allow_render_execution=true only for the guarded staging render infrastructure canary."
          exit 1

      - name: Require explicit Cloud Run approval
        if: ${{ !inputs.allow_cloud_run }}
        run: |
          echo "::error::Set allow_cloud_run=true only when a dedicated staging Cloud Run canary target is configured."
          exit 1

      - name: Require explicit Remotion approval
        if: ${{ !inputs.allow_remotion }}
        run: |
          echo "::error::Set allow_remotion=true only when a dedicated staging Remotion canary path is configured."
          exit 1

      - name: Require smoke cleanup
        if: ${{ !inputs.cleanup }}
        run: |
          echo "::error::This render infrastructure canary requires cleanup=true."
          exit 1

      - name: Require bounded smoke inputs
        run: |
          if ! echo "${SUPABASE_E2E_USER_ID}" | grep -Eiq '^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'; then
            echo "::error::smoke_user_id must be an existing safe staging Supabase auth user UUID."
            exit 1
          fi
          for smoke_id in "${SUPABASE_E2E_PREVIOUS_WRITE_SMOKE_RUN_ID}" "${SUPABASE_E2E_PREVIOUS_PERSISTED_RENDER_SMOKE_RUN_ID}" "${SUPABASE_E2E_PREVIOUS_SANDBOX_RENDER_SMOKE_RUN_ID}"; do
            if ! echo "${smoke_id}" | grep -Eq '^rp-e2e-smoke-[0-9a-f-]{36}$'; then
              echo "::error::All previous smoke run ids must match rp-e2e-smoke-<uuid>."
              exit 1
            fi
          done
          if ! echo "${SUPABASE_E2E_MAX_WAIT_SECONDS}" | grep -Eq '^[0-9]+$'; then
            echo "::error::max_wait_seconds must be numeric."
            exit 1
          fi
          if [ "${SUPABASE_E2E_MAX_WAIT_SECONDS}" -lt 30 ] || [ "${SUPABASE_E2E_MAX_WAIT_SECONDS}" -gt 300 ]; then
            echo "::error::max_wait_seconds must stay between 30 and 300."
            exit 1
          fi
          for name in GCP_PROJECT_ID GCP_REGION GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT STAGING_RENDER_CANARY_CLOUD_RUN_URL STAGING_RENDER_CANARY_CLOUD_RUN_AUDIENCE STAGING_RENDER_CANARY_OUTPUT_BUCKET_OR_PREFIX; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} is required for the guarded staging Cloud Run Remotion canary."
              exit 1
            fi
          done
          case "${GCP_PROJECT_ID} ${GCP_SERVICE_ACCOUNT} ${STAGING_RENDER_CANARY_CLOUD_RUN_URL} ${STAGING_RENDER_CANARY_CLOUD_RUN_AUDIENCE} ${STAGING_RENDER_CANARY_OUTPUT_BUCKET_OR_PREFIX}" in
            *prod*|*production*|*live*)
              echo "::error::Staging render canary configuration must not look production/live."
              exit 1
              ;;
          esac
          if ! echo "${GCP_PROJECT_ID} ${GCP_SERVICE_ACCOUNT} ${STAGING_RENDER_CANARY_CLOUD_RUN_URL} ${STAGING_RENDER_CANARY_CLOUD_RUN_AUDIENCE} ${STAGING_RENDER_CANARY_OUTPUT_BUCKET_OR_PREFIX}" | grep -Eiq 'staging|canary|smoke|test'; then
            echo "::error::Staging render canary configuration must be staging/canary/smoke scoped."
            exit 1
          fi

      - name: Checkout readiness branch
        uses: actions/checkout@v4
        with:
          ref: codex/reeditpro-e2e-readiness

      - name: Authenticate to Google Cloud for canary invocation
        id: gcp-auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ secrets.STAGING_RENDER_CANARY_CLOUD_RUN_AUDIENCE }}
          create_credentials_file: false

      - name: Mask Cloud Run ID token
        run: echo "::add-mask::${{ steps.gcp-auth.outputs.id_token }}"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build API
        run: npm run build:api

      - name: Typecheck API
        run: npm run typecheck:api

      - name: Supabase live env check
        run: npm run smoke:supabase:live-env

      - name: Supabase table readiness
        run: npm run smoke:supabase:tables

      - name: Supabase RPC readiness
        run: npm run smoke:supabase:rpcs

      - name: Supabase RLS/auth audit
        run: npm run smoke:supabase:rls-auth

      - name: Previous write smoke leftover check
        run: npm run smoke:supabase:leftovers -- --smoke-run-id="${SUPABASE_E2E_PREVIOUS_WRITE_SMOKE_RUN_ID}"

      - name: Previous persisted render smoke leftover check
        run: npm run smoke:supabase:leftovers -- --smoke-run-id="${SUPABASE_E2E_PREVIOUS_PERSISTED_RENDER_SMOKE_RUN_ID}"

      - name: Previous sandbox render smoke leftover check
        run: npm run smoke:supabase:leftovers -- --smoke-run-id="${SUPABASE_E2E_PREVIOUS_SANDBOX_RENDER_SMOKE_RUN_ID}"

      - name: Strict Cloud Run Remotion infrastructure canary
        env:
          STAGING_RENDER_CANARY_ID_TOKEN: ${{ steps.gcp-auth.outputs.id_token }}
        run: timeout "${SUPABASE_E2E_MAX_WAIT_SECONDS}s" npm run smoke:e2e:render-infrastructure-canary:strict
