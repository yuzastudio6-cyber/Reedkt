name: Private Browser API Gateway Staging Activation

on:
  workflow_dispatch:
    inputs:
      confirm_private_browser_gateway_activation:
        description: "Type ACTIVATE_REEDITPRO_PRIVATE_BROWSER_STAGING"
        required: true
        type: string
      confirm_internal_cloud_cost:
        description: "Type ACCEPT_REEDITPRO_PRIVATE_STAGING_CLOUD_COST; this never charges customer credits"
        required: true
        type: string
      source_ref:
        description: "Exact reviewed source branch"
        required: true
        default: "codex/backend-workflow-pipeline-continuation"
        type: string
      source_sha:
        description: "Exact 40-character source SHA at the tip of source_ref"
        required: true
        type: string
      expected_cloud_run_revision:
        description: "Current ready revision that this activation is allowed to replace"
        required: true
        type: string
      supabase_url_secret_version:
        description: "Pinned positive Secret Manager version for SUPABASE_URL"
        required: true
        type: string
      supabase_anon_key_secret_version:
        description: "Pinned positive Secret Manager version for SUPABASE_ANON_KEY"
        required: true
        type: string
      supabase_service_role_key_secret_version:
        description: "Pinned positive Secret Manager version for SUPABASE_SERVICE_ROLE_KEY"
        required: true
        type: string
      internal_service_token_secret_version:
        description: "Pinned positive Secret Manager version for REEDITPRO_INTERNAL_SERVICE_TOKEN"
        required: true
        type: string
      storage_activation_run_id:
        description: "Successful same-SHA Signed-In Private Media Storage Staging Activation workflow run ID"
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: reeditpro-private-browser-api-gateway-staging-activation
  cancel-in-progress: false

jobs:
  activate-private-browser-gateway:
    name: Activate exact private browser staging lane
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: staging
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ secrets.GCP_REGION || vars.GCP_REGION }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER || vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_DEPLOYER_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT || vars.GCP_SERVICE_ACCOUNT }}
      STAGING_APP_ORIGIN: ${{ vars.REEDITPRO_STAGING_APP_ORIGIN }}
      STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      EXPECTED_LEGACY_INVOKER_MEMBER: ${{ secrets.REEDITPRO_STAGING_LEGACY_INVOKER_MEMBER }}
      CLOUD_RUN_SERVICE: reeditpro-api-staging
      CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT: reeditpro-api-staging@reeditpro.iam.gserviceaccount.com
      API_GATEWAY_API_ID: reeditpro-browser-staging
      API_GATEWAY_ID: reeditpro-browser-staging
      API_GATEWAY_SERVICE_ACCOUNT: reeditpro-api-gateway-staging@reeditpro.iam.gserviceaccount.com
      ARTIFACT_REGION: us-central1
      ARTIFACT_REPOSITORY: reeditpro-staging-workers
    steps:
      - name: Fail closed unless every activation input is exact
        shell: bash
        env:
          CONFIRM_ACTIVATION: ${{ inputs.confirm_private_browser_gateway_activation }}
          CONFIRM_INTERNAL_CLOUD_COST: ${{ inputs.confirm_internal_cloud_cost }}
          SOURCE_REF: ${{ inputs.source_ref }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          EXPECTED_CLOUD_RUN_REVISION: ${{ inputs.expected_cloud_run_revision }}
          SUPABASE_URL_SECRET_VERSION: ${{ inputs.supabase_url_secret_version }}
          SUPABASE_ANON_KEY_SECRET_VERSION: ${{ inputs.supabase_anon_key_secret_version }}
          SUPABASE_SERVICE_ROLE_KEY_SECRET_VERSION: ${{ inputs.supabase_service_role_key_secret_version }}
          INTERNAL_SERVICE_TOKEN_SECRET_VERSION: ${{ inputs.internal_service_token_secret_version }}
          STORAGE_ACTIVATION_RUN_ID: ${{ inputs.storage_activation_run_id }}
        run: |
          set -euo pipefail
          test "${CONFIRM_ACTIVATION}" = "ACTIVATE_REEDITPRO_PRIVATE_BROWSER_STAGING"
          test "${CONFIRM_INTERNAL_CLOUD_COST}" = "ACCEPT_REEDITPRO_PRIVATE_STAGING_CLOUD_COST"
          test "${SOURCE_REF}" = "codex/backend-workflow-pipeline-continuation"
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "${GITHUB_REF}" = "refs/heads/${SOURCE_REF}"
          test "${GITHUB_SHA}" = "${SOURCE_SHA}"
          [[ "${EXPECTED_CLOUD_RUN_REVISION}" =~ ^reeditpro-api-staging-[a-z0-9-]+$ ]]
          test "${GCP_PROJECT_ID}" = "reeditpro"
          test "${GCP_REGION}" = "us-east1"
          test -n "${GCP_WORKLOAD_IDENTITY_PROVIDER}"
          [[ "${GCP_DEPLOYER_SERVICE_ACCOUNT}" =~ ^[a-z0-9-]+@reeditpro\.iam\.gserviceaccount\.com$ ]]
          test "${CLOUD_RUN_SERVICE}" = "reeditpro-api-staging"
          test "${CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT}" = "reeditpro-api-staging@reeditpro.iam.gserviceaccount.com"
          test "${API_GATEWAY_API_ID}" = "reeditpro-browser-staging"
          test "${API_GATEWAY_ID}" = "reeditpro-browser-staging"
          test "${API_GATEWAY_SERVICE_ACCOUNT}" = "reeditpro-api-gateway-staging@reeditpro.iam.gserviceaccount.com"
          test "${ARTIFACT_REGION}" = "us-central1"
          test "${ARTIFACT_REPOSITORY}" = "reeditpro-staging-workers"
          case "${STAGING_APP_ORIGIN}" in
            "https://yuzastudio6-cyber.github.io"|"https://app.reeditpro.com") ;;
            *) exit 1 ;;
          esac
          [[ "${STAGING_SUPABASE_URL}" =~ ^https://[a-z0-9]+\.supabase\.co$ ]]
          for version in \
            "${SUPABASE_URL_SECRET_VERSION}" \
            "${SUPABASE_ANON_KEY_SECRET_VERSION}" \
            "${SUPABASE_SERVICE_ROLE_KEY_SECRET_VERSION}" \
            "${INTERNAL_SERVICE_TOKEN_SECRET_VERSION}"; do
            [[ "${version}" =~ ^[1-9][0-9]*$ ]]
          done
          [[ "${STORAGE_ACTIVATION_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          if [ -n "${EXPECTED_LEGACY_INVOKER_MEMBER}" ]; then
            echo "::add-mask::${EXPECTED_LEGACY_INVOKER_MEMBER}"
            [[ "${EXPECTED_LEGACY_INVOKER_MEMBER}" =~ ^serviceAccount:[a-z0-9-]+@reeditpro\.iam\.gserviceaccount\.com$ ]]
            test "${EXPECTED_LEGACY_INVOKER_MEMBER}" != "serviceAccount:${API_GATEWAY_SERVICE_ACCOUNT}"
          fi

      - name: Checkout exact reviewed source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1

      - name: Verify immutable source tip and clean deploy context
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          test -z "$(git status --porcelain)"
          test -f docker/prod/api/Dockerfile
          test -f package-lock.json
          test -f server/config/google-api-gateway-openapi.ts
          test -f server/config/google-api-gateway-readiness.ts
          git diff --exit-code -- package-lock.json .dockerignore docker/prod/api/Dockerfile

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install immutable dependencies
        run: npm ci --no-audit --no-fund --progress=false

      - name: Prove source security and gateway contracts before cloud access
        run: |
          set -euo pipefail
          npm run smoke:google-api-gateway-browser-transport
          npm run smoke:google-api-gateway-readiness
          npm run smoke:production-api-deployment-contract
          npm run smoke:runtime-api-security
          npm run smoke:canonical-private-package-state-transaction
          npm run smoke:canonical-distributed-package-state-port
          npm run smoke:canonical-distributed-package-state-rpc-adapter
          npm run smoke:canonical-cloud-dispatch-handoff
          npm run smoke:canonical-live-google-service-identity-verifier
          npm run smoke:canonical-cloud-dispatch-outbox-receivers
          npm run smoke:protected-internal-testing-release-candidate-admission
          npm run typecheck:server
          npm run check:frontend-boundary
          npm run check:secrets

      - name: Require canonical product UI integration before cloud activation
        env:
          REEDITPRO_REQUIRE_CANONICAL_PRODUCT_UI_READY: "true"
        run: |
          set -euo pipefail
          npm run smoke:canonical-product-ui-integration-readiness
          npm run internal-testing:verify-canonical-product-ui-integration-readiness

      - name: Require exact same-SHA protected internal testing source admission
        env:
          REEDITPRO_INTERNAL_TESTING_SOURCE_REF: ${{ inputs.source_ref }}
          REEDITPRO_INTERNAL_TESTING_SOURCE_SHA: ${{ inputs.source_sha }}
        run: npm run internal-testing:verify-protected-release-candidate

      - name: Require successful same-SHA private media storage activation run
        id: storage_activation_run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ inputs.source_ref }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          STORAGE_ACTIVATION_RUN_ID: ${{ inputs.storage_activation_run_id }}
        run: |
          set -euo pipefail
          activation_run="${RUNNER_TEMP}/storage-activation-run.json"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${STORAGE_ACTIVATION_RUN_ID}" > "${activation_run}"
          python3 - \
            "${activation_run}" \
            "${GITHUB_REPOSITORY}" \
            "${SOURCE_REF}" \
            "${SOURCE_SHA}" \
            "${STORAGE_ACTIVATION_RUN_ID}" \
            "${GITHUB_OUTPUT}" <<'PY'
          import json
          import pathlib
          import sys

          run = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8") or "{}")
          if (run.get("repository") or {}).get("full_name") != sys.argv[2]:
              raise SystemExit("Storage activation belongs to another repository.")
          if run.get("name") != "Signed-In Private Media Storage Staging Activation":
              raise SystemExit("Storage activation has the wrong workflow name.")
          if str(run.get("path") or "").split("@")[0] != ".github/workflows/signed-in-private-media-storage-staging-activation.yml":
              raise SystemExit("Storage activation has the wrong workflow path.")
          if run.get("event") != "workflow_dispatch" or run.get("status") != "completed" or run.get("conclusion") != "success":
              raise SystemExit("Storage activation did not complete successfully.")
          if run.get("head_branch") != sys.argv[3] or run.get("head_sha") != sys.argv[4]:
              raise SystemExit("Storage activation source does not match the gateway source exactly.")
          if run.get("id") != int(sys.argv[5]):
              raise SystemExit("Storage activation run ID does not match the requested evidence.")
          attempt = run.get("run_attempt")
          if not isinstance(attempt, int) or attempt < 1:
              raise SystemExit("Storage activation run attempt is missing or invalid.")
          with pathlib.Path(sys.argv[6]).open("a", encoding="utf-8") as handle:
              handle.write(f"run_attempt={attempt}\n")
          PY

      - name: Download exact immutable storage activation evidence
        uses: actions/download-artifact@v8
        with:
          name: reeditpro-signed-in-private-media-storage-activation-${{ inputs.storage_activation_run_id }}-${{ steps.storage_activation_run.outputs.run_attempt }}
          path: ${{ runner.temp }}/storage-activation-evidence
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.storage_activation_run_id }}

      - name: Bind gateway deployment to exact storage activation evidence
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          STORAGE_ACTIVATION_RUN_ID: ${{ inputs.storage_activation_run_id }}
          STORAGE_ACTIVATION_RUN_ATTEMPT: ${{ steps.storage_activation_run.outputs.run_attempt }}
        run: |
          set -euo pipefail
          evidence_file="${RUNNER_TEMP}/storage-activation-evidence/reeditpro-signed-in-private-media-storage-activation.json"
          test -s "${evidence_file}"
          python3 - \
            "${evidence_file}" \
            "${GITHUB_REPOSITORY}" \
            "${SOURCE_REF}" \
            "${SOURCE_SHA}" \
            "${STORAGE_ACTIVATION_RUN_ID}" \
            "${STORAGE_ACTIVATION_RUN_ATTEMPT}" \
            "${GITHUB_ENV}" <<'PY'
          import json
          import pathlib
          import re
          import sys

          evidence = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8") or "{}")
          expected_keys = {
              "schemaVersion", "repository", "workflowPath", "workflowRunId", "workflowRunAttempt",
              "sourceRef", "sourceSha", "projectId", "region", "runtimeServiceAccount", "appOrigin",
              "bucketNames", "readinessContractVersion", "readinessEvidenceSha256",
              "configurationReadinessPassed", "liveCorsPreflightPassed", "storageMode",
              "largeMediaFinalizationMode", "maximumHostedUploadBytesWithoutDistributedFinalization",
              "objectWriteVerified", "signedUrlVerified", "resumableUploadVerified",
              "largeMediaDistributedFinalizationVerified", "providerEnabled", "workerEnabled",
              "customerBillingEnabled", "publicDeliveryEnabled", "productionEnabled",
          }
          if not isinstance(evidence, dict) or set(evidence) != expected_keys:
              raise SystemExit("Storage activation evidence schema is invalid.")
          expected = {
              "schemaVersion": 1,
              "repository": sys.argv[2],
              "workflowPath": ".github/workflows/signed-in-private-media-storage-staging-activation.yml",
              "workflowRunId": int(sys.argv[5]),
              "workflowRunAttempt": int(sys.argv[6]),
              "sourceRef": sys.argv[3],
              "sourceSha": sys.argv[4],
              "projectId": "reeditpro",
              "region": "us-east1",
              "runtimeServiceAccount": "reeditpro-api-staging@reeditpro.iam.gserviceaccount.com",
              "appOrigin": "https://yuzastudio6-cyber.github.io",
              "readinessContractVersion": "signed-in-private-media-storage-readiness-v1",
              "configurationReadinessPassed": True,
              "liveCorsPreflightPassed": True,
              "storageMode": "gcs",
              "largeMediaFinalizationMode": "disabled",
              "maximumHostedUploadBytesWithoutDistributedFinalization": 16777216,
              "objectWriteVerified": False,
              "signedUrlVerified": False,
              "resumableUploadVerified": False,
              "largeMediaDistributedFinalizationVerified": False,
              "providerEnabled": False,
              "workerEnabled": False,
              "customerBillingEnabled": False,
              "publicDeliveryEnabled": False,
              "productionEnabled": False,
          }
          for key, value in expected.items():
              if evidence.get(key) != value:
                  raise SystemExit(f"Storage activation evidence mismatch: {key}")
          if not re.fullmatch(r"[0-9a-f]{64}", str(evidence.get("readinessEvidenceSha256", ""))):
              raise SystemExit("Storage activation readiness digest is invalid.")
          purposes = ["source_media", "generated_assets", "processed_media", "previews", "exports", "thumbnails", "qa_artifacts", "worker_temp"]
          buckets = evidence.get("bucketNames")
          if not isinstance(buckets, dict) or set(buckets) != set(purposes):
              raise SystemExit("Storage activation bucket map is invalid.")
          environment_names = {
              "source_media": "GCS_SOURCE_MEDIA_BUCKET",
              "generated_assets": "GCS_GENERATED_ASSETS_BUCKET",
              "processed_media": "GCS_PROCESSED_MEDIA_BUCKET",
              "previews": "GCS_PREVIEWS_BUCKET",
              "exports": "GCS_EXPORTS_BUCKET",
              "thumbnails": "GCS_THUMBNAILS_BUCKET",
              "qa_artifacts": "GCS_QA_ARTIFACTS_BUCKET",
              "worker_temp": "GCS_WORKER_TEMP_BUCKET",
          }
          with pathlib.Path(sys.argv[7]).open("a", encoding="utf-8") as handle:
              for purpose in purposes:
                  expected_bucket = f"reeditpro-staging-reeditpro-us-east1-{purpose.replace('_', '-')}"
                  if buckets.get(purpose) != expected_bucket:
                      raise SystemExit(f"Storage activation bucket mismatch: {purpose}")
                  handle.write(f"{environment_names[purpose]}={expected_bucket}\n")
          PY

      - name: Authenticate to Google Cloud with keyless OIDC
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOYER_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
          cleanup_credentials: true

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Run read-only cloud IAM secret and Supabase JWKS preflight
        shell: bash
        env:
          EXPECTED_CLOUD_RUN_REVISION: ${{ inputs.expected_cloud_run_revision }}
          SUPABASE_URL_SECRET_VERSION: ${{ inputs.supabase_url_secret_version }}
          SUPABASE_ANON_KEY_SECRET_VERSION: ${{ inputs.supabase_anon_key_secret_version }}
          SUPABASE_SERVICE_ROLE_KEY_SECRET_VERSION: ${{ inputs.supabase_service_role_key_secret_version }}
          INTERNAL_SERVICE_TOKEN_SECRET_VERSION: ${{ inputs.internal_service_token_secret_version }}
        run: |
          set -euo pipefail
          current_revision="$(
            gcloud run services describe "${CLOUD_RUN_SERVICE}" \
              --project="${GCP_PROJECT_ID}" \
              --region="${GCP_REGION}" \
              --format='value(status.latestReadyRevisionName)'
          )"
          test "${current_revision}" = "${EXPECTED_CLOUD_RUN_REVISION}"
          runtime_account="$(
            gcloud run services describe "${CLOUD_RUN_SERVICE}" \
              --project="${GCP_PROJECT_ID}" \
              --region="${GCP_REGION}" \
              --format='value(spec.template.spec.serviceAccountName)'
          )"
          test "${runtime_account}" = "${CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT}"
          gcloud iam service-accounts describe "${CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT}" \
            --project="${GCP_PROJECT_ID}" \
            --format=none

          service_policy="${RUNNER_TEMP}/cloud-run-service-iam.json"
          project_policy="${RUNNER_TEMP}/project-iam.json"
          gcloud run services get-iam-policy "${CLOUD_RUN_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --format=json > "${service_policy}"
          gcloud projects get-iam-policy "${GCP_PROJECT_ID}" \
            --format=json > "${project_policy}"
          python3 - \
            "${service_policy}" \
            "${project_policy}" \
            "serviceAccount:${API_GATEWAY_SERVICE_ACCOUNT}" \
            "${EXPECTED_LEGACY_INVOKER_MEMBER}" \
            "${GITHUB_ENV}" <<'PY'
          import json
          import pathlib
          import sys

          service_policy = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8") or "{}")
          project_policy = json.loads(pathlib.Path(sys.argv[2]).read_text(encoding="utf-8") or "{}")
          gateway_member = sys.argv[3]
          legacy_member = sys.argv[4]
          github_env = pathlib.Path(sys.argv[5])

          def invokers(policy):
              members = set()
              for binding in policy.get("bindings") or []:
                  if binding.get("role") == "roles/run.invoker":
                      members.update(member for member in binding.get("members") or [] if isinstance(member, str))
              return members

          service_invokers = invokers(service_policy)
          project_invokers = invokers(project_policy)
          if project_invokers:
              raise SystemExit("Project-level roles/run.invoker is forbidden for this staging lane.")
          if {"allUsers", "allAuthenticatedUsers"} & service_invokers:
              raise SystemExit("Public Cloud Run invocation is forbidden.")
          allowed = {gateway_member}
          if legacy_member:
              allowed.add(legacy_member)
          if service_invokers - allowed:
              raise SystemExit("An unexpected service-level Cloud Run invoker exists.")
          with github_env.open("a", encoding="utf-8") as handle:
              handle.write(f"GATEWAY_WAS_INVOKER={'true' if gateway_member in service_invokers else 'false'}\n")
              handle.write(f"LEGACY_WAS_INVOKER={'true' if legacy_member and legacy_member in service_invokers else 'false'}\n")
          PY

          gcloud secrets versions describe "${SUPABASE_URL_SECRET_VERSION}" \
            --secret=SUPABASE_URL --project="${GCP_PROJECT_ID}" --format=none
          gcloud secrets versions describe "${SUPABASE_ANON_KEY_SECRET_VERSION}" \
            --secret=SUPABASE_ANON_KEY --project="${GCP_PROJECT_ID}" --format=none
          gcloud secrets versions describe "${SUPABASE_SERVICE_ROLE_KEY_SECRET_VERSION}" \
            --secret=SUPABASE_SERVICE_ROLE_KEY --project="${GCP_PROJECT_ID}" --format=none
          gcloud secrets versions describe "${INTERNAL_SERVICE_TOKEN_SECRET_VERSION}" \
            --secret=REEDITPRO_INTERNAL_SERVICE_TOKEN --project="${GCP_PROJECT_ID}" --format=none

          jwks_file="${RUNNER_TEMP}/supabase-jwks.json"
          curl --fail --silent --show-error --max-time 15 \
            "${STAGING_SUPABASE_URL}/auth/v1/.well-known/jwks.json" > "${jwks_file}"
          python3 - "${jwks_file}" <<'PY'
          import json
          import pathlib
          import sys

          jwks = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8") or "{}")
          keys = jwks.get("keys")
          if not isinstance(keys, list) or not keys:
              raise SystemExit("Supabase JWKS has no asymmetric verification key.")
          private_fields = {"d", "p", "q", "dp", "dq", "qi", "oth"}
          for key in keys:
              if not isinstance(key, dict) or private_fields & set(key):
                  raise SystemExit("Supabase JWKS contains an invalid key record.")
              is_es256 = key.get("kty") == "EC" and key.get("alg") == "ES256" and key.get("crv") == "P-256"
              is_rs256 = key.get("kty") == "RSA" and key.get("alg") == "RS256"
              if not (is_es256 or is_rs256) or not key.get("kid"):
                  raise SystemExit("Supabase JWKS is not fully ES256/RS256 gateway compatible.")
          PY
          echo "PREVIOUS_CLOUD_RUN_REVISION=${current_revision}" >> "${GITHUB_ENV}"
          echo "ROLLBACK_STATE_CAPTURED=true" >> "${GITHUB_ENV}"

      - name: Enable only the required API Gateway services
        shell: bash
        run: |
          set -euo pipefail
          gcloud services enable \
            apigateway.googleapis.com \
            servicemanagement.googleapis.com \
            servicecontrol.googleapis.com \
            --project="${GCP_PROJECT_ID}" \
            --quiet

      - name: Capture existing gateway rollback target
        shell: bash
        run: |
          set -euo pipefail
          previous_gateway_config=""
          if gcloud api-gateway gateways describe "${API_GATEWAY_ID}" \
            --project="${GCP_PROJECT_ID}" \
            --location="${GCP_REGION}" \
            --format=none >/dev/null 2>&1; then
            previous_gateway_config="$(
              gcloud api-gateway gateways describe "${API_GATEWAY_ID}" \
                --project="${GCP_PROJECT_ID}" \
                --location="${GCP_REGION}" \
                --format='value(apiConfig)'
            )"
          fi
          echo "PREVIOUS_GATEWAY_CONFIG=${previous_gateway_config}" >> "${GITHUB_ENV}"

      - name: Create keyless gateway identity and exact service-level authority
        shell: bash
        run: |
          set -euo pipefail
          if ! gcloud iam service-accounts describe "${API_GATEWAY_SERVICE_ACCOUNT}" \
            --project="${GCP_PROJECT_ID}" --format=none >/dev/null 2>&1; then
            gcloud iam service-accounts create reeditpro-api-gateway-staging \
              --project="${GCP_PROJECT_ID}" \
              --display-name="ReEditPro private browser staging gateway" \
              --quiet
          fi
          disabled="$(
            gcloud iam service-accounts describe "${API_GATEWAY_SERVICE_ACCOUNT}" \
              --project="${GCP_PROJECT_ID}" \
              --format='value(disabled)'
          )"
          test "${disabled,,}" != "true"
          gcloud iam service-accounts add-iam-policy-binding "${API_GATEWAY_SERVICE_ACCOUNT}" \
            --project="${GCP_PROJECT_ID}" \
            --member="serviceAccount:${GCP_DEPLOYER_SERVICE_ACCOUNT}" \
            --role=roles/iam.serviceAccountUser \
            --condition=None \
            --format=none \
            --quiet
          gcloud run services add-iam-policy-binding "${CLOUD_RUN_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --member="serviceAccount:${API_GATEWAY_SERVICE_ACCOUNT}" \
            --role=roles/run.invoker \
            --condition=None \
            --format=none \
            --quiet

      - name: Build and push immutable staging API image
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          registry_host="${ARTIFACT_REGION}-docker.pkg.dev"
          image="${registry_host}/${GCP_PROJECT_ID}/${ARTIFACT_REPOSITORY}/reeditpro-api:sha-${SOURCE_SHA}"
          gcloud auth configure-docker "${registry_host}" --quiet
          docker build -f docker/prod/api/Dockerfile -t "${image}" .
          docker push "${image}"
          image_digest_ref="$(docker inspect --format='{{index .RepoDigests 0}}' "${image}")"
          [[ "${image_digest_ref}" =~ @sha256:[0-9a-f]{64}$ ]]
          echo "STAGING_API_IMAGE=${image_digest_ref}" >> "${GITHUB_ENV}"

      - name: Deploy reviewed IAM-private Cloud Run browser API revision
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SUPABASE_URL_SECRET_VERSION: ${{ inputs.supabase_url_secret_version }}
          SUPABASE_ANON_KEY_SECRET_VERSION: ${{ inputs.supabase_anon_key_secret_version }}
          SUPABASE_SERVICE_ROLE_KEY_SECRET_VERSION: ${{ inputs.supabase_service_role_key_secret_version }}
          INTERNAL_SERVICE_TOKEN_SECRET_VERSION: ${{ inputs.internal_service_token_secret_version }}
        run: |
          set -euo pipefail
          gcloud run deploy "${CLOUD_RUN_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --image="${STAGING_API_IMAGE}" \
            --service-account="${CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT}" \
            --port=8080 \
            --cpu=2 \
            --memory=2Gi \
            --concurrency=20 \
            --min-instances=0 \
            --max-instances=3 \
            --timeout=60s \
            --execution-environment=gen2 \
            --ingress=all \
            --invoker-iam-check \
            --set-env-vars="^@^REEDITPRO_ENV=staging@E2E_RUNTIME_MODE=cloud_run@WORKER_RUNTIME_MODE=disabled@STORAGE_MODE=gcs@REEDITPRO_LARGE_MEDIA_FINALIZATION_MODE=disabled@REEDITPRO_DISABLE_DOTENV=true@REEDITPRO_BROWSER_API_TRANSPORT=google_api_gateway@API_ALLOWED_CORS_ORIGINS=${STAGING_APP_ORIGIN}@GOOGLE_CLOUD_PROJECT_ID=${GCP_PROJECT_ID}@GOOGLE_CLOUD_REGION=${GCP_REGION}@GCS_DEFAULT_REGION=${GCP_REGION}@GCS_SOURCE_MEDIA_BUCKET=${GCS_SOURCE_MEDIA_BUCKET}@GCS_GENERATED_ASSETS_BUCKET=${GCS_GENERATED_ASSETS_BUCKET}@GCS_PROCESSED_MEDIA_BUCKET=${GCS_PROCESSED_MEDIA_BUCKET}@GCS_PREVIEWS_BUCKET=${GCS_PREVIEWS_BUCKET}@GCS_EXPORTS_BUCKET=${GCS_EXPORTS_BUCKET}@GCS_THUMBNAILS_BUCKET=${GCS_THUMBNAILS_BUCKET}@GCS_QA_ARTIFACTS_BUCKET=${GCS_QA_ARTIFACTS_BUCKET}@GCS_WORKER_TEMP_BUCKET=${GCS_WORKER_TEMP_BUCKET}" \
            --set-secrets="SUPABASE_URL=SUPABASE_URL:${SUPABASE_URL_SECRET_VERSION},SUPABASE_ANON_KEY=SUPABASE_ANON_KEY:${SUPABASE_ANON_KEY_SECRET_VERSION},SUPABASE_SERVICE_ROLE_KEY=SUPABASE_SERVICE_ROLE_KEY:${SUPABASE_SERVICE_ROLE_KEY_SECRET_VERSION},REEDITPRO_INTERNAL_SERVICE_TOKEN=REEDITPRO_INTERNAL_SERVICE_TOKEN:${INTERNAL_SERVICE_TOKEN_SECRET_VERSION}" \
            --labels="lane=private-browser,source-sha=${SOURCE_SHA}" \
            --no-allow-unauthenticated \
            --quiet
          cloud_run_url="$(
            gcloud run services describe "${CLOUD_RUN_SERVICE}" \
              --project="${GCP_PROJECT_ID}" \
              --region="${GCP_REGION}" \
              --format='value(status.url)'
          )"
          [[ "${cloud_run_url}" =~ ^https://[a-z0-9-]+([.][a-z0-9-]+)*[.]run[.]app$ ]]
          new_revision="$(
            gcloud run services describe "${CLOUD_RUN_SERVICE}" \
              --project="${GCP_PROJECT_ID}" \
              --region="${GCP_REGION}" \
              --format='value(status.latestReadyRevisionName)'
          )"
          test -n "${new_revision}"
          revision_image="$(
            gcloud run revisions describe "${new_revision}" \
              --project="${GCP_PROJECT_ID}" \
              --region="${GCP_REGION}" \
              --format='value(spec.containers[0].image)'
          )"
          test "${revision_image}" = "${STAGING_API_IMAGE}"
          echo "CLOUD_RUN_URL=${cloud_run_url}" >> "${GITHUB_ENV}"
          echo "NEW_CLOUD_RUN_REVISION=${new_revision}" >> "${GITHUB_ENV}"

      - name: Create immutable JWT gateway API config
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if ! gcloud api-gateway apis describe "${API_GATEWAY_API_ID}" \
            --project="${GCP_PROJECT_ID}" --format=none >/dev/null 2>&1; then
            gcloud api-gateway apis create "${API_GATEWAY_API_ID}" \
              --project="${GCP_PROJECT_ID}" \
              --display-name="ReEditPro private browser staging API" \
              --labels=lane=private-browser \
              --quiet
          fi
          managed_service="$(
            gcloud api-gateway apis describe "${API_GATEWAY_API_ID}" \
              --project="${GCP_PROJECT_ID}" \
              --format='value(managedService)'
          )"
          [[ "${managed_service}" =~ ^[a-z0-9-]+\.apigateway\.reeditpro\.cloud\.goog$ ]]
          openapi_file="${RUNNER_TEMP}/reeditpro-private-browser-openapi.json"
          REEDITPRO_API_GATEWAY_HOSTNAME="${managed_service}" \
          REEDITPRO_CLOUD_RUN_API_URL="${CLOUD_RUN_URL}" \
          SUPABASE_URL="${STAGING_SUPABASE_URL}" \
            npm run --silent staging:render-google-api-gateway-openapi > "${openapi_file}"
          openapi_sha="$(sha256sum "${openapi_file}" | awk '{print $1}')"
          config_id="cfg-${SOURCE_SHA:0:16}"
          spec_label="${openapi_sha:0:32}"
          if gcloud api-gateway api-configs describe "${config_id}" \
            --api="${API_GATEWAY_API_ID}" \
            --project="${GCP_PROJECT_ID}" \
            --format=json > "${RUNNER_TEMP}/existing-api-config.json" 2>/dev/null; then
            python3 - \
              "${RUNNER_TEMP}/existing-api-config.json" \
              "${SOURCE_SHA}" \
              "${spec_label}" \
              "${API_GATEWAY_SERVICE_ACCOUNT}" <<'PY'
          import json
          import pathlib
          import sys

          config = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8") or "{}")
          labels = config.get("labels") or {}
          backend = ((config.get("gatewayConfig") or {}).get("backendConfig") or {})
          if config.get("state") != "ACTIVE":
              raise SystemExit("Existing immutable API config is not ACTIVE.")
          if labels.get("source-sha") != sys.argv[2] or labels.get("spec-sha") != sys.argv[3]:
              raise SystemExit("Existing immutable API config labels do not match source/spec evidence.")
          if backend.get("googleServiceAccount") != sys.argv[4]:
              raise SystemExit("Existing immutable API config uses the wrong backend identity.")
          PY
          else
            gcloud api-gateway api-configs create "${config_id}" \
              --api="${API_GATEWAY_API_ID}" \
              --project="${GCP_PROJECT_ID}" \
              --openapi-spec="${openapi_file}" \
              --backend-auth-service-account="${API_GATEWAY_SERVICE_ACCOUNT}" \
              --display-name="${config_id}" \
              --labels="lane=private-browser,source-sha=${SOURCE_SHA},spec-sha=${spec_label}" \
              --quiet
          fi
          test "$(
            gcloud api-gateway api-configs describe "${config_id}" \
              --api="${API_GATEWAY_API_ID}" \
              --project="${GCP_PROJECT_ID}" \
              --format='value(state)'
          )" = "ACTIVE"
          gcloud services enable "${managed_service}" \
            --project="${GCP_PROJECT_ID}" \
            --quiet
          echo "TARGET_API_CONFIG_ID=${config_id}" >> "${GITHUB_ENV}"

      - name: Deploy or update the regional gateway
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if gcloud api-gateway gateways describe "${API_GATEWAY_ID}" \
            --project="${GCP_PROJECT_ID}" \
            --location="${GCP_REGION}" \
            --format=none >/dev/null 2>&1; then
            gcloud api-gateway gateways update "${API_GATEWAY_ID}" \
              --project="${GCP_PROJECT_ID}" \
              --location="${GCP_REGION}" \
              --api="${API_GATEWAY_API_ID}" \
              --api-config="${TARGET_API_CONFIG_ID}" \
              --update-labels="lane=private-browser,source-sha=${SOURCE_SHA}" \
              --quiet
          else
            gcloud api-gateway gateways create "${API_GATEWAY_ID}" \
              --project="${GCP_PROJECT_ID}" \
              --location="${GCP_REGION}" \
              --api="${API_GATEWAY_API_ID}" \
              --api-config="${TARGET_API_CONFIG_ID}" \
              --display-name="ReEditPro private browser staging gateway" \
              --labels="lane=private-browser,source-sha=${SOURCE_SHA}" \
              --quiet
          fi
          gateway_json="${RUNNER_TEMP}/deployed-gateway.json"
          gcloud api-gateway gateways describe "${API_GATEWAY_ID}" \
            --project="${GCP_PROJECT_ID}" \
            --location="${GCP_REGION}" \
            --format=json > "${gateway_json}"
          gateway_hostname="$(python3 - "${gateway_json}" "${TARGET_API_CONFIG_ID}" <<'PY'
          import json
          import pathlib
          import sys

          gateway = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8") or "{}")
          if gateway.get("state") not in {"ACTIVE", "READY"}:
              raise SystemExit("Gateway is not active.")
          if str(gateway.get("apiConfig", "")).split("/")[-1] != sys.argv[2]:
              raise SystemExit("Gateway does not reference the target immutable API config.")
          hostname = gateway.get("defaultHostname")
          if not isinstance(hostname, str) or not hostname.endswith(".gateway.dev"):
              raise SystemExit("Gateway hostname is missing or invalid.")
          print(hostname)
          PY
          )"
          echo "GATEWAY_ORIGIN=https://${gateway_hostname}" >> "${GITHUB_ENV}"

      - name: Verify public health private backend denial auth denial and exact CORS
        shell: bash
        run: |
          set -euo pipefail
          health_body="${RUNNER_TEMP}/gateway-health.json"
          health_status="$(curl --silent --show-error --max-time 20 \
            --output "${health_body}" --write-out '%{http_code}' \
            "${GATEWAY_ORIGIN}/health")"
          test "${health_status}" = "200"
          python3 - "${health_body}" <<'PY'
          import json
          import pathlib
          import sys
          body = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8") or "{}")
          data = body.get("data") or {}
          if body.get("ok") is not True or data.get("service") != "reeditpro-api" or data.get("status") != "ok":
              raise SystemExit("Gateway public health response is invalid.")
          PY

          direct_status="$(curl --silent --show-error --max-time 20 \
            --output /dev/null --write-out '%{http_code}' \
            "${CLOUD_RUN_URL}/health")"
          test "${direct_status}" = "403"

          auth_status="$(curl --silent --show-error --max-time 20 \
            --output /dev/null --write-out '%{http_code}' \
            "${GATEWAY_ORIGIN}/v1/projects")"
          test "${auth_status}" = "401"

          cors_headers="${RUNNER_TEMP}/gateway-cors-headers.txt"
          cors_status="$(curl --silent --show-error --max-time 20 \
            --request OPTIONS \
            --header "Origin: ${STAGING_APP_ORIGIN}" \
            --header "Access-Control-Request-Method: POST" \
            --header "Access-Control-Request-Headers: authorization,content-type,x-reeditpro-user-authorization" \
            --dump-header "${cors_headers}" \
            --output /dev/null \
            --write-out '%{http_code}' \
            "${GATEWAY_ORIGIN}/v1/projects")"
          test "${cors_status}" = "204"
          grep -Fqi "access-control-allow-origin: ${STAGING_APP_ORIGIN}" "${cors_headers}"
          grep -Fqi "x-reeditpro-user-authorization" "${cors_headers}"
          if grep -Fqi "access-control-allow-credentials: true" "${cors_headers}"; then
            exit 1
          fi

      - name: Reconcile the exact legacy invoker only after gateway proof
        shell: bash
        run: |
          set -euo pipefail
          if [ "${LEGACY_WAS_INVOKER}" = "true" ]; then
            gcloud run services remove-iam-policy-binding "${CLOUD_RUN_SERVICE}" \
              --project="${GCP_PROJECT_ID}" \
              --region="${GCP_REGION}" \
              --member="${EXPECTED_LEGACY_INVOKER_MEMBER}" \
              --role=roles/run.invoker \
              --condition=None \
              --format=none \
              --quiet
          fi

      - name: Require strict sanitized deployed readiness
        env:
          REEDITPRO_REQUIRE_GATEWAY_READY: "true"
        run: npm run staging:verify-google-api-gateway-readiness

      - name: Create sanitized activation evidence for the hosted app handoff
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          STORAGE_ACTIVATION_RUN_ID: ${{ inputs.storage_activation_run_id }}
          STORAGE_ACTIVATION_RUN_ATTEMPT: ${{ steps.storage_activation_run.outputs.run_attempt }}
        run: |
          set -euo pipefail
          evidence_file="${RUNNER_TEMP}/reeditpro-private-browser-staging-activation.json"
          python3 - \
            "${evidence_file}" \
            "${GITHUB_REPOSITORY}" \
            "${GITHUB_RUN_ID}" \
            "${GITHUB_RUN_ATTEMPT}" \
            "${SOURCE_REF}" \
            "${SOURCE_SHA}" \
            "${GCP_PROJECT_ID}" \
            "${GCP_REGION}" \
            "${CLOUD_RUN_SERVICE}" \
            "${NEW_CLOUD_RUN_REVISION}" \
            "${API_GATEWAY_API_ID}" \
            "${TARGET_API_CONFIG_ID}" \
            "${API_GATEWAY_ID}" \
            "${GATEWAY_ORIGIN}" \
            "${STAGING_APP_ORIGIN}" \
            "${STORAGE_ACTIVATION_RUN_ID}" \
            "${STORAGE_ACTIVATION_RUN_ATTEMPT}" <<'PY'
          import json
          import pathlib
          import re
          import sys

          (
              output_path,
              repository,
              run_id,
              run_attempt,
              source_ref,
              source_sha,
              project_id,
              region,
              cloud_run_service,
              cloud_run_revision,
              api_id,
              api_config_id,
              gateway_id,
              gateway_origin,
              app_origin,
              storage_activation_run_id,
              storage_activation_run_attempt,
          ) = sys.argv[1:]

          if not re.fullmatch(r"[1-9][0-9]*", run_id) or not re.fullmatch(r"[1-9][0-9]*", run_attempt):
              raise SystemExit("Workflow run evidence is invalid.")
          if repository != "yuzastudio6-cyber/Reedkt":
              raise SystemExit("Activation evidence repository is invalid.")
          if source_ref != "codex/backend-workflow-pipeline-continuation" or not re.fullmatch(r"[0-9a-f]{40}", source_sha):
              raise SystemExit("Activation evidence source is invalid.")
          if project_id != "reeditpro" or region != "us-east1" or cloud_run_service != "reeditpro-api-staging":
              raise SystemExit("Activation evidence cloud scope is invalid.")
          if not re.fullmatch(r"reeditpro-api-staging-[a-z0-9-]+", cloud_run_revision):
              raise SystemExit("Activation evidence Cloud Run revision is invalid.")
          if api_id != "reeditpro-browser-staging" or gateway_id != "reeditpro-browser-staging":
              raise SystemExit("Activation evidence gateway identity is invalid.")
          if api_config_id != f"cfg-{source_sha[:16]}":
              raise SystemExit("Activation evidence API config does not match the source SHA.")
          if not re.fullmatch(r"https://[a-z0-9-]+(?:[.][a-z0-9-]+)*[.]gateway[.]dev", gateway_origin):
              raise SystemExit("Activation evidence gateway origin is invalid.")
          if app_origin not in {"https://yuzastudio6-cyber.github.io", "https://app.reeditpro.com"}:
              raise SystemExit("Activation evidence app origin is invalid.")
          if not re.fullmatch(r"[1-9][0-9]*", storage_activation_run_id) or not re.fullmatch(r"[1-9][0-9]*", storage_activation_run_attempt):
              raise SystemExit("Storage activation run evidence is invalid.")

          evidence = {
              "schemaVersion": 2,
              "repository": repository,
              "workflowPath": ".github/workflows/beta-readiness-api-staging-deploy.yml",
              "workflowRunId": int(run_id),
              "workflowRunAttempt": int(run_attempt),
              "sourceRef": source_ref,
              "sourceSha": source_sha,
              "projectId": project_id,
              "region": region,
              "cloudRunService": cloud_run_service,
              "cloudRunRevision": cloud_run_revision,
              "apiId": api_id,
              "apiConfigId": api_config_id,
              "gatewayId": gateway_id,
              "gatewayOrigin": gateway_origin,
              "appOrigin": app_origin,
              "browserApiTransport": "google_api_gateway",
              "storageActivationRunId": int(storage_activation_run_id),
              "storageActivationRunAttempt": int(storage_activation_run_attempt),
              "storageMode": "gcs",
              "storageConfigurationEnabled": True,
              "storageExecutionEnabled": True,
              "storageExecutionVerified": False,
              "largeMediaFinalizationMode": "disabled",
              "maximumHostedUploadBytesWithoutDistributedFinalization": 16777216,
              "largeMediaDistributedFinalizationVerified": False,
              "strictReadinessPassed": True,
              "cloudRunIamPrivate": True,
              "gatewaySoleServiceLevelInvoker": True,
              "providersEnabled": False,
              "workersEnabled": False,
              "customerBillingEnabled": False,
              "publicDeliveryEnabled": False,
              "productionEnabled": False,
          }
          pathlib.Path(output_path).write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          test -s "${evidence_file}"

      - name: Upload immutable sanitized activation evidence
        uses: actions/upload-artifact@v7
        with:
          name: reeditpro-private-browser-staging-activation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/reeditpro-private-browser-staging-activation.json
          if-no-files-found: error
          retention-days: 30

      - name: Record private staging activation boundary
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          {
            echo '# ReEditPro Private Browser Staging Activation'
            echo ''
            echo "- Source SHA: \`${SOURCE_SHA}\`"
            echo "- Cloud Run revision: \`${NEW_CLOUD_RUN_REVISION}\`"
            echo "- API config: \`${TARGET_API_CONFIG_ID}\`"
            echo "- Gateway origin: \`${GATEWAY_ORIGIN}\`"
            echo '- Cloud Run is IAM-private and the gateway service account is its sole service-level invoker.'
            echo '- Internal Google Cloud staging cost was explicitly accepted; no customer price, credit, wallet, or billing mutation occurred.'
            echo '- Supabase was contacted only through its public JWKS endpoint; no Supabase write or migration occurred.'
            echo '- Private GCS source transport is configured from same-SHA storage evidence; runtime object-write and signed-URL proof remain interactive gates.'
            echo '- Hosted uploads above 16 MiB fail before bytes until distributed large-media finalization is verified.'
            echo '- Providers, workers, public rendering, customer billing, external beta, and production remain disabled.'
            echo '- A real Google user session and protected tenant route still require the separate interactive signed-in test gate.'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Restore prior private access state after any activation failure
        if: ${{ failure() }}
        continue-on-error: true
        shell: bash
        run: |
          set +e
          if [ "${ROLLBACK_STATE_CAPTURED:-false}" = "true" ]; then
            if [ -n "${PREVIOUS_GATEWAY_CONFIG:-}" ]; then
              gcloud api-gateway gateways update "${API_GATEWAY_ID}" \
                --project="${GCP_PROJECT_ID}" \
                --location="${GCP_REGION}" \
                --api-config="${PREVIOUS_GATEWAY_CONFIG}" \
                --quiet
            fi
            if [ -n "${PREVIOUS_CLOUD_RUN_REVISION:-}" ]; then
              gcloud run services update-traffic "${CLOUD_RUN_SERVICE}" \
                --project="${GCP_PROJECT_ID}" \
                --region="${GCP_REGION}" \
                --to-revisions="${PREVIOUS_CLOUD_RUN_REVISION}=100" \
                --quiet
            fi
            if [ "${LEGACY_WAS_INVOKER:-false}" = "true" ] && [ -n "${EXPECTED_LEGACY_INVOKER_MEMBER}" ]; then
              gcloud run services add-iam-policy-binding "${CLOUD_RUN_SERVICE}" \
                --project="${GCP_PROJECT_ID}" \
                --region="${GCP_REGION}" \
                --member="${EXPECTED_LEGACY_INVOKER_MEMBER}" \
                --role=roles/run.invoker \
                --condition=None \
                --format=none \
                --quiet
            fi
            if [ "${GATEWAY_WAS_INVOKER:-false}" != "true" ]; then
              gcloud run services remove-iam-policy-binding "${CLOUD_RUN_SERVICE}" \
                --project="${GCP_PROJECT_ID}" \
                --region="${GCP_REGION}" \
                --member="serviceAccount:${API_GATEWAY_SERVICE_ACCOUNT}" \
                --role=roles/run.invoker \
                --condition=None \
                --format=none \
                --quiet
            fi
          fi
          echo 'Activation failed; prior Cloud Run traffic and service-level invoker state were restored when available.' >> "${GITHUB_STEP_SUMMARY}"
          echo 'New API/config/gateway resources are intentionally retained for owner review; this workflow never deletes cloud resources.' >> "${GITHUB_STEP_SUMMARY}"
