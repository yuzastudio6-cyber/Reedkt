steps:
  - id: pull-immutable-source-preparation-image
    name: gcr.io/cloud-builders/docker@sha256:f8b08c609fdc392ee6827ff3e1725e4980f7d96bde9f76f4695086405c96c147
    args:
      - pull
      - ${_IMMUTABLE_IMAGE}
  - id: archive-immutable-source-preparation-image
    name: gcr.io/cloud-builders/docker@sha256:f8b08c609fdc392ee6827ff3e1725e4980f7d96bde9f76f4695086405c96c147
    waitFor:
      - pull-immutable-source-preparation-image
    args:
      - save
      - --output
      - /workspace/sam31-source-preparation-image.tar
      - ${_IMMUTABLE_IMAGE}
  - id: generate-spdx-2-3-sbom
    name: docker.io/anchore/syft@sha256:2baa4d24d90599840c0100a8d30deaa533821fcd99f405ce6f90e3d225bd836d
    waitFor:
      - archive-immutable-source-preparation-image
    args:
      - scan
      - docker-archive:/workspace/sam31-source-preparation-image.tar
      - --output
      - spdx-json=/workspace/sam31-source-preparation.spdx.json
  - id: prepare-signature-artifacts
    name: gcr.io/cloud-builders/docker@sha256:f8b08c609fdc392ee6827ff3e1725e4980f7d96bde9f76f4695086405c96c147
    waitFor:
      - generate-spdx-2-3-sbom
    entrypoint: /bin/sh
    args:
      - -ceu
      - |
        : > /workspace/cosign-signature.bundle.json
        : > /workspace/cosign-verification.json
        chmod 0666 /workspace/cosign-signature.bundle.json /workspace/cosign-verification.json
  - id: sign-immutable-source-preparation-image
    name: gcr.io/projectsigstore/cosign@sha256:de9c65609e6bde17e6b48de485ee788407c9502fa08b8f4459f595b21f56cd00
    waitFor:
      - prepare-signature-artifacts
    args:
      - sign
      - --yes
      - --key
      - gcpkms://projects/reeditpro/locations/us-central1/keyRings/weeditpro-image-signing/cryptoKeys/sam31-image-signing/cryptoKeyVersions/1
      - --use-signing-config=false
      - --tlog-upload=false
      - --bundle
      - /workspace/cosign-signature.bundle.json
      - ${_IMMUTABLE_IMAGE}
  - id: verify-immutable-source-preparation-image-signature
    name: gcr.io/projectsigstore/cosign@sha256:de9c65609e6bde17e6b48de485ee788407c9502fa08b8f4459f595b21f56cd00
    waitFor:
      - sign-immutable-source-preparation-image
    args:
      - verify
      - --key
      - gcpkms://projects/reeditpro/locations/us-central1/keyRings/weeditpro-image-signing/cryptoKeys/sam31-image-signing/cryptoKeyVersions/1
      - --insecure-ignore-tlog=true
      - --output
      - json
      - --output-file
      - /workspace/cosign-verification.json
      - ${_IMMUTABLE_IMAGE}
artifacts:
  objects:
    location: ${_EVIDENCE_LOCATION}
    paths:
      - sam31-source-preparation.spdx.json
      - cosign-signature.bundle.json
      - cosign-verification.json
timeout: 3600s
queueTtl: 600s
options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 200
  logging: CLOUD_LOGGING_ONLY
  requestedVerifyOption: VERIFIED
serviceAccount: projects/reeditpro/serviceAccounts/reeditpro-image-signer-sa@reeditpro.iam.gserviceaccount.com
tags:
  - weeditpro
  - sam3-1
  - source-preparation-l4
  - private-image-supply-chain
