steps:
  - name: pytorch/pytorch@sha256:b574d4ccf6d8856a5d87dcadc667aa4f95dc18d337ef3a28d02b7b01897d7081
    id: fetch-and-verify-exact-official-pycocotools-wheel
    entrypoint: bash
    args:
      - -ceu
      - |
        mkdir -p /workspace/private-pycocotools-ingest
        python -I -B - <<'PY'
        import email.parser
        import hashlib
        import os
        from pathlib import Path, PurePosixPath
        import stat
        from urllib.parse import urlparse
        from urllib.request import HTTPRedirectHandler, Request, build_opener
        from zipfile import ZipFile

        url = (
            "https://files.pythonhosted.org/packages/23/59/"
            "dc81895beff4e1207a829d40d442ea87cefaac9f6499151965f05c479619/"
            "pycocotools-2.0.11-cp312-abi3-manylinux2014_x86_64."
            "manylinux_2_17_x86_64.manylinux_2_28_x86_64.whl"
        )
        expected_sha256 = (
            "a82d1c9ed83f75da0b3f244f2a3cf559351a283307bd9b79a4ee2b93ab3231dd"
        )
        expected_bytes = 411685
        destination = Path(
            "/workspace/private-pycocotools-ingest/"
            "pycocotools-2.0.11-cp312-abi3-manylinux2014_x86_64."
            "manylinux_2_17_x86_64.manylinux_2_28_x86_64.whl"
        )
        temporary = destination.with_suffix(".whl.partial")

        def assert_allowed_https(value: str) -> None:
            parsed = urlparse(value)
            if (
                parsed.scheme != "https"
                or parsed.hostname != "files.pythonhosted.org"
                or parsed.username
                or parsed.password
                or parsed.port not in (None, 443)
            ):
                raise SystemExit(
                    "pycocotools wheel origin is not exact official PyPI HTTPS"
                )

        class ExactRedirectHandler(HTTPRedirectHandler):
            def redirect_request(self, request, file_pointer, code, message,
                                 headers, new_url):
                assert_allowed_https(new_url)
                return super().redirect_request(
                    request, file_pointer, code, message, headers, new_url
                )

        assert_allowed_https(url)
        temporary.unlink(missing_ok=True)
        request = Request(
            url,
            headers={
                "Accept-Encoding": "identity",
                "User-Agent": "WeEditPro-SAM31-pycocotools-ingest-v1",
            },
            method="GET",
        )
        digest = hashlib.sha256()
        observed_bytes = 0
        try:
            with build_opener(ExactRedirectHandler()).open(
                request, timeout=120
            ) as response, temporary.open("xb") as output:
                assert_allowed_https(response.geturl())
                if response.status != 200:
                    raise SystemExit("pycocotools wheel response status changed")
                while True:
                    chunk = response.read(64 * 1024)
                    if not chunk:
                        break
                    observed_bytes += len(chunk)
                    if observed_bytes > expected_bytes:
                        raise SystemExit(
                            "pycocotools wheel exceeded exact byte bound"
                        )
                    digest.update(chunk)
                    output.write(chunk)
                output.flush()
                os.fsync(output.fileno())
            if observed_bytes != expected_bytes:
                raise SystemExit("pycocotools wheel byte count changed")
            if digest.hexdigest() != expected_sha256:
                raise SystemExit("pycocotools wheel digest changed")
            os.replace(temporary, destination)
        finally:
            temporary.unlink(missing_ok=True)

        with ZipFile(destination) as archive:
            members = archive.infolist()
            for member in members:
                path = PurePosixPath(member.filename)
                file_type = (member.external_attr >> 16) & 0o170000
                if (
                    path.is_absolute()
                    or ".." in path.parts
                    or file_type == stat.S_IFLNK
                ):
                    raise SystemExit("pycocotools wheel archive entry is unsafe")
            metadata_names = [
                item.filename for item in members
                if item.filename.endswith(".dist-info/METADATA")
            ]
            extension_names = [
                item.filename for item in members
                if item.filename.startswith("pycocotools/")
                and item.filename.endswith(".abi3.so")
            ]
            if len(metadata_names) != 1 or len(extension_names) != 1:
                raise SystemExit(
                    "pycocotools wheel metadata or extension shape changed"
                )
            metadata = email.parser.BytesParser().parsebytes(
                archive.read(metadata_names[0])
            )
            extension = archive.read(extension_names[0])
        if metadata["Name"] != "pycocotools" or metadata["Version"] != "2.0.11":
            raise SystemExit("pycocotools wheel identity changed")
        if metadata["Requires-Python"] != ">=3.9":
            raise SystemExit("pycocotools Python compatibility changed")
        if metadata["License"] != "FreeBSD":
            raise SystemExit("pycocotools license metadata changed")
        if not extension.startswith(b"\x7fELF"):
            raise SystemExit("pycocotools native extension is not ELF")
        destination.chmod(0o444)
        PY
        chmod 0777 /workspace/private-pycocotools-ingest
  - name: us-central1-docker.pkg.dev/reeditpro/reeditpro-workers/weeditpro-sam31-private-artifact-review@sha256:51c995ea5e6ef0ee43e2f011f45657acd4ce038dc5d6510852630fa1f5543a20
    id: malware-scan-exact-pycocotools-wheel
    waitFor:
      - fetch-and-verify-exact-official-pycocotools-wheel
    entrypoint: sh
    args:
      - -ceu
      - |
        wheel="$$(find /workspace/private-pycocotools-ingest -maxdepth 1 \
          -type f -name 'pycocotools-2.0.11-*.whl')"
        test -n "$${wheel}"
        scanner_version="$$(clamscan --version)"
        scan_output="$$(clamscan --infected --scan-archive=yes \
          --max-filesize=32M --max-scansize=64M --max-recursion=16 \
          --max-files=10000 --max-scantime=0 "$${wheel}")"
        printf '%s\n' "$${scan_output}"
        known_viruses="$$(printf '%s\n' "$${scan_output}" \
          | sed -n 's/^Known viruses:[[:space:]]*//p')"
        scanned_files="$$(printf '%s\n' "$${scan_output}" \
          | sed -n 's/^Scanned files:[[:space:]]*//p')"
        infected_files="$$(printf '%s\n' "$${scan_output}" \
          | sed -n 's/^Infected files:[[:space:]]*//p')"
        test "$${known_viruses}" -ge 1000000
        test "$${scanned_files}" -ge 1
        test "$${infected_files}" = 0
        printf '%s\n%s\n%s\n' "$${scanner_version}" \
          "$${known_viruses}" "$${scanned_files}" \
          > /workspace/private-pycocotools-ingest/scan-summary.txt
        chmod 0444 /workspace/private-pycocotools-ingest/scan-summary.txt
  - name: pytorch/pytorch@sha256:b574d4ccf6d8856a5d87dcadc667aa4f95dc18d337ef3a28d02b7b01897d7081
    id: import-exact-pycocotools-wheel-offline
    waitFor:
      - malware-scan-exact-pycocotools-wheel
    entrypoint: bash
    args:
      - -ceu
      - |
        wheel="$$(find /workspace/private-pycocotools-ingest -maxdepth 1 \
          -type f -name 'pycocotools-2.0.11-*.whl')"
        mkdir -p /workspace/private-pycocotools-ingest/import-target
        python -m pip install --no-index --no-deps --no-cache-dir \
          --target=/workspace/private-pycocotools-ingest/import-target \
          "$${wheel}"
        python -I -B - <<'PY'
        import importlib.metadata
        import pathlib
        import sys
        target = pathlib.Path(
            "/workspace/private-pycocotools-ingest/import-target"
        )
        sys.path.insert(0, str(target))
        import pycocotools.mask as mask_util
        assert mask_util.__file__.startswith(str(target))
        assert importlib.metadata.version("pycocotools") == "2.0.11"
        PY
        rm -rf /workspace/private-pycocotools-ingest/import-target
  - name: gcr.io/google.com/cloudsdktool/google-cloud-cli@sha256:38b6345faa0554a3bfae9a79f175379cc8e95d2290dd7070848e2f8497e62428
    id: create-only-publish-and-reread-exact-pycocotools-wheel
    waitFor:
      - import-exact-pycocotools-wheel-offline
    entrypoint: bash
    args:
      - -ceu
      - |
        wheel="$$(find /workspace/private-pycocotools-ingest -maxdepth 1 \
          -type f -name 'pycocotools-2.0.11-*.whl')"
        object=gs://reeditpro-production-reeditpro-image-build-inputs/private/image-build-inputs/sam3_1/qualification/python-wheels/pycocotools/2.0.11/a82d1c9ed83f75da0b3f244f2a3cf559351a283307bd9b79a4ee2b93ab3231dd.whl
        test "$$(stat --format='%s' "$${wheel}")" = 411685
        printf '%s  %s\n' \
          a82d1c9ed83f75da0b3f244f2a3cf559351a283307bd9b79a4ee2b93ab3231dd \
          "$${wheel}" | sha256sum --check --strict
        gcloud storage cp --if-generation-match=0 \
          --content-type=application/zip --cache-control=no-store \
          "$${wheel}" "$${object}"
        gcloud storage cp "$${object}" \
          /workspace/private-pycocotools-ingest/published-wheel-reread.whl
        cmp "$${wheel}" \
          /workspace/private-pycocotools-ingest/published-wheel-reread.whl
        gcloud storage objects describe "$${object}" --format=json \
          > /workspace/private-pycocotools-ingest/object-metadata.json
  - name: pytorch/pytorch@sha256:b574d4ccf6d8856a5d87dcadc667aa4f95dc18d337ef3a28d02b7b01897d7081
    id: compile-exact-pycocotools-ingest-receipt
    waitFor:
      - create-only-publish-and-reread-exact-pycocotools-wheel
    entrypoint: bash
    args:
      - -ceu
      - |
        python -I -B - \
          /workspace/private-pycocotools-ingest/object-metadata.json \
          /workspace/private-pycocotools-ingest/scan-summary.txt \
          /workspace/private-pycocotools-ingest/pycocotools-ingest-receipt.json \
          "${BUILD_ID}" "${_REPOSITORY_COMMIT}" "${_REPOSITORY_TREE}" <<'PY'
        import hashlib
        import json
        from pathlib import Path
        import re
        import sys

        metadata_path, scan_path, receipt_path = map(Path, sys.argv[1:4])
        build_id, repository_commit, repository_tree = sys.argv[4:]
        metadata = json.loads(metadata_path.read_text(encoding="utf-8"))
        scanner_version, signature_count, scanned_files = scan_path.read_text(
            encoding="utf-8"
        ).splitlines()
        generation = str(metadata.get("generation", ""))
        etag = str(metadata.get("etag", ""))
        if re.fullmatch(r"[1-9][0-9]{9,}", generation) is None or not etag:
            raise SystemExit("pycocotools private object identity is incomplete")
        if int(metadata.get("size", -1)) != 411685:
            raise SystemExit("pycocotools private object byte count changed")
        if metadata.get("content_type") != "application/zip":
            raise SystemExit("pycocotools private object content type changed")
        if metadata.get("cache_control") != "no-store":
            raise SystemExit("pycocotools private object cache policy changed")
        receipt = {
            "schemaVersion": (
                "weeditpro-sam3_1-pycocotools-private-ingest-receipt-v1"
            ),
            "buildId": build_id,
            "createOnlyPublicationBuildId": build_id,
            "repositoryCommit": repository_commit,
            "repositoryTree": repository_tree,
            "packageName": "pycocotools",
            "packageVersion": "2.0.11",
            "pythonRequires": ">=3.9",
            "license": "FreeBSD",
            "officialOrigin": "files.pythonhosted.org",
            "officialWheelSha256": (
                "a82d1c9ed83f75da0b3f244f2a3cf559351a283307bd9b79a4ee2b93ab3231dd"
            ),
            "officialWheelByteLength": 411685,
            "wheelPlatform": "manylinux_x86_64",
            "pythonAbi": "cp312-abi3",
            "nativeExtensionImportVerified": True,
            "privateObject": {
                "bucketName": (
                    "reeditpro-production-reeditpro-image-build-inputs"
                ),
                "objectName": (
                    "private/image-build-inputs/sam3_1/qualification/"
                    "python-wheels/pycocotools/2.0.11/"
                    "a82d1c9ed83f75da0b3f244f2a3cf559351a283307bd9b79a4ee2b93ab3231dd.whl"
                ),
                "generation": generation,
                "etag": etag,
                "byteLength": 411685,
                "sha256": (
                    "a82d1c9ed83f75da0b3f244f2a3cf559351a283307bd9b79a4ee2b93ab3231dd"
                ),
                "crc32c": str(metadata.get("crc32c_hash", "")),
                "md5Hash": str(metadata.get("md5_hash", "")),
                "contentType": "application/zip",
                "cacheControl": "no-store",
            },
            "malwareScan": {
                "scannerImageDigest": (
                    "sha256:51c995ea5e6ef0ee43e2f011f45657acd4ce038dc5d6510852630fa1f5543a20"
                ),
                "scannerVersion": scanner_version,
                "signatureCount": int(signature_count),
                "scannedFileCount": int(scanned_files),
                "infectedFileCount": 0,
                "scanPassed": True,
            },
            "createOnlyPublicationRequired": True,
            "developerMachineInstallPerformed": False,
            "checkpointIncluded": False,
            "modelExecuted": False,
            "gpuJobDispatched": False,
            "customerCreditsMutated": False,
            "runtimeReleaseGranted": False,
            "productionAuthorityGranted": False,
        }
        canonical = json.dumps(
            receipt, sort_keys=True, separators=(",", ":"),
            ensure_ascii=False, allow_nan=False,
        ).encode("utf-8")
        receipt["receiptHash"] = hashlib.sha256(canonical).hexdigest()
        Path(receipt_path).write_text(
            json.dumps(
                receipt, sort_keys=True, separators=(",", ":"),
                ensure_ascii=False, allow_nan=False,
            ) + "\n",
            encoding="utf-8",
        )
        PY
        chmod 0444 \
          /workspace/private-pycocotools-ingest/pycocotools-ingest-receipt.json
artifacts:
  objects:
    location: gs://reeditpro-production-reeditpro-image-build-inputs/private/image-build-inputs/sam3_1/qualification/python-wheels/pycocotools/2.0.11/ingest/${BUILD_ID}/
    paths:
      - private-pycocotools-ingest/pycocotools-ingest-receipt.json
timeout: 900s
queueTtl: 600s
serviceAccount: projects/reeditpro/serviceAccounts/reeditpro-image-builder-sa@reeditpro.iam.gserviceaccount.com
options:
  diskSizeGb: '100'
  logging: CLOUD_LOGGING_ONLY
  requestedVerifyOption: VERIFIED
  sourceProvenanceHash:
    - SHA256
tags:
  - weeditpro
  - sam3-1
  - qualification-pycocotools-ingest
