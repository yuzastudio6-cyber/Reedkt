name: Foundation Validation

on:
  pull_request:
    branches:
      - codex/rp-foundation-03c-validation-toolchain-repair
      - codex/rp-foundation-04-storage-upload-production-runtime
      - codex/rp-foundation-05-approved-plan-snapshot-service
      - codex/rp-foundation-06-credit-ledger-approval-gate-runtime
      - codex/rp-foundation-07-backend-api-runtime-route-hardening
      - codex/rp-foundation-08-job-orchestration-worker-claims-idempotency
      - codex/rp-foundation-09-media-readiness-probe-transcript-timing
      - codex/rp-foundation-10-render-preview-export-foundation
      - codex/rp-foundation-10a-render-preview-export-validation-hardening
      - codex/rp-foundation-03b-auth-rls-validation-environment-fix
      - codex/reeditpro-planning-stack
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation-validation:
    name: Foundation validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run default foundation validation
        run: npm run foundation:validate

      - name: Run foundation validation with full build
        run: npm run foundation:validate:with-build
