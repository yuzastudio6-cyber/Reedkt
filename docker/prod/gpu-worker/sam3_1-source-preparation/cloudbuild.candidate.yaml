steps:
  - id: build-purpose-bound-source-preparation-image
    name: gcr.io/cloud-builders/docker@sha256:f8b08c609fdc392ee6827ff3e1725e4980f7d96bde9f76f4695086405c96c147
    entrypoint: docker
    args:
      - build
      - --pull=false
      - --no-cache
      - --platform=linux/amd64
      - --file
      - docker/prod/gpu-worker/sam3_1-source-preparation/Dockerfile.candidate
      - --tag
      - ${_IMMUTABLE_CANDIDATE_TAG}
      - --build-arg
      - WEEDITPRO_SOURCE_COMMIT_SHA=${_SOURCE_COMMIT_SHA}
      - --build-arg
      - WEEDITPRO_SOURCE_TREE_HASH=${_SOURCE_TREE_HASH}
      - --build-arg
      - WEEDITPRO_SOURCE_CLEAN=true
      - .
images:
  - ${_IMMUTABLE_CANDIDATE_TAG}
timeout: 3600s
queueTtl: 600s
options:
  machineType: E2_HIGHCPU_32
  diskSizeGb: 200
  logging: CLOUD_LOGGING_ONLY
  requestedVerifyOption: VERIFIED
  sourceProvenanceHash:
    - SHA256
serviceAccount: projects/reeditpro/serviceAccounts/reeditpro-image-builder-sa@reeditpro.iam.gserviceaccount.com
tags:
  - weeditpro
  - sam3-1
  - source-preparation-l4
  - private-image-build
