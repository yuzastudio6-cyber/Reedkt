# ReeditPro local-only Supabase configuration.
#
# This file is for isolated local validation only. It contains no secrets, no
# provider keys, no service-role key, no remote project ref, and no staging or
# production linkage. Do not add a [remotes.*] block here. Do not run
# `supabase link`, `supabase db push`, or remote migrations from this repo.

project_id = "reeditpro-local"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173", "http://localhost:5173"]
jwt_expiry = 3600

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true

[analytics]
enabled = false
port = 54327
backend = "postgres"
