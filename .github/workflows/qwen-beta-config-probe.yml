name: Qwen Beta Config Probe

on:
  workflow_dispatch:
    inputs:
      confirm_qwen_beta_config_probe:
        description: Type PROBE_REEDITPRO_QWEN_BETA_CONFIG to inspect Qwen config metadata only
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: qwen-beta-config-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      REEDITPRO_CONFIRM_QWEN_BETA_CONFIG_PROBE: ${{ inputs.confirm_qwen_beta_config_probe }}
      GOOGLE_CLOUD_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      QWEN_REASONING_API_KEY: ${{ secrets.QWEN_REASONING_API_KEY }}
      QWEN_REASONING_API_KEY_SECRET: ${{ vars.QWEN_REASONING_API_KEY_SECRET }}
      QWEN_REASONING_BASE_URL: ${{ vars.QWEN_REASONING_BASE_URL }}
      QWEN_REASONING_BASE_URL_SECRET: ${{ vars.QWEN_REASONING_BASE_URL_SECRET }}
      QWEN_REASONING_MODEL_ID: ${{ vars.QWEN_REASONING_MODEL_ID }}
      QWEN_REASONING_MODEL_ID_SECRET: ${{ vars.QWEN_REASONING_MODEL_ID_SECRET }}
      QWEN_REASONING_TRANSPORT_PROFILE: ${{ vars.QWEN_REASONING_TRANSPORT_PROFILE }}
      QWEN_REASONING_REQUEST_PATH: ${{ vars.QWEN_REASONING_REQUEST_PATH }}
      QWEN_REASONING_TIMEOUT_MS: ${{ vars.QWEN_REASONING_TIMEOUT_MS }}
      QWEN_REASONING_MAX_RETRIES: ${{ vars.QWEN_REASONING_MAX_RETRIES }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Authenticate to Google Cloud for Secret Manager metadata
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Install dependencies for metadata probe
        run: npm ci --no-audit --no-fund --progress=false

      - name: Probe Qwen beta metadata without reading secret payloads
        run: npm run probe:qwen-beta-config
