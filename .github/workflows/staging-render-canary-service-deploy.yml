name: RP E2E Staging Render Canary Service Deploy

on:
  workflow_dispatch:
    inputs:
      allow_staging_canary_deploy:
        description: "Required: deploy only the private staging render canary service"
        required: true
        default: "false"
      target_ref:
        description: "Readiness branch/ref to deploy"
        required: true
        default: "codex/reeditpro-e2e-readiness"
      target_sha:
        description: "Exact commit SHA to deploy"
        required: true
        default: "3d2ba2eb2c476e117063e52fea01a0b478b0bbd1"
      service_name:
        description: "Staging Cloud Run service name"
        required: true
        default: "reeditpro-staging-render-canary"

permissions:
  contents: read
  id-token: write

jobs:
  deploy-staging-render-canary-service:
    name: Deploy private staging render canary service
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ secrets.GCP_REGION || vars.GCP_REGION }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER || vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT || vars.GCP_SERVICE_ACCOUNT }}
      STAGING_RENDER_CANARY_OUTPUT_BUCKET_OR_PREFIX: ${{ secrets.STAGING_RENDER_CANARY_OUTPUT_BUCKET_OR_PREFIX || vars.STAGING_RENDER_CANARY_OUTPUT_BUCKET_OR_PREFIX }}
      STAGING_RENDER_CANARY_MEMORY: "2Gi"
      STAGING_RENDER_CANARY_CPU: "2"
      STAGING_RENDER_CANARY_CONCURRENCY: "1"
      STAGING_RENDER_CANARY_TIMEOUT_SECONDS: "300"
      STAGING_RENDER_CANARY_NODE_OPTIONS: "--max-old-space-size=1536"
      STAGING_RENDER_CANARY_IMAGE_REPOSITORY: "us-east1-docker.pkg.dev/reeditpro/reeditpro-runtime/reeditpro-staging-render-canary"

    steps:
      - name: Fail closed unless this is the exact staging canary deploy
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.allow_staging_canary_deploy }}" = "true"
          test "${{ inputs.target_ref }}" = "codex/reeditpro-e2e-readiness"
          [[ "${{ inputs.target_sha }}" =~ ^[0-9a-f]{40}$ ]]
          test "${{ inputs.service_name }}" = "reeditpro-staging-render-canary"
          test "${GCP_PROJECT_ID}" = "reeditpro"
          test "${GCP_REGION}" = "us-east1"
          test "${STAGING_RENDER_CANARY_OUTPUT_BUCKET_OR_PREFIX}" = "gs://reeditpro-staging-render-canary-smoke/previews"
          test "${STAGING_RENDER_CANARY_MEMORY}" = "2Gi"
          test "${STAGING_RENDER_CANARY_CPU}" = "2"
          test "${STAGING_RENDER_CANARY_CONCURRENCY}" = "1"
          test "${STAGING_RENDER_CANARY_TIMEOUT_SECONDS}" = "300"
          test "${STAGING_RENDER_CANARY_NODE_OPTIONS}" = "--max-old-space-size=1536"
          test "${STAGING_RENDER_CANARY_IMAGE_REPOSITORY}" = "us-east1-docker.pkg.dev/reeditpro/reeditpro-runtime/reeditpro-staging-render-canary"
          case "${GCP_PROJECT_ID} ${GCP_REGION} ${{ inputs.service_name }} ${STAGING_RENDER_CANARY_OUTPUT_BUCKET_OR_PREFIX}" in
            *prod*|*production*|*live*)
              echo "Refusing production-looking staging canary deploy target." >&2
              exit 1
              ;;
          esac

      - name: Checkout exact readiness commit
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0

      - name: Verify target commit
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "${{ inputs.target_sha }}" HEAD
          git checkout --detach "${{ inputs.target_sha }}"
          actual="$(git rev-parse HEAD)"
          test "${actual}" = "${{ inputs.target_sha }}"

      - name: Authenticate to Google Cloud with OIDC/WIF
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
          cleanup_credentials: true

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Capture current Cloud Run revision
        id: before
        shell: bash
        run: |
          set -euo pipefail
          before_revision="$(
            gcloud run services describe '${{ inputs.service_name }}' \
              --project "${GCP_PROJECT_ID}" \
              --region "${GCP_REGION}" \
              --format='value(status.latestReadyRevisionName)'
          )"
          echo "revision=${before_revision}" >> "${GITHUB_OUTPUT}"
          echo "Current revision: ${before_revision}"

      - name: Derive fixed staging canary image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image="${STAGING_RENDER_CANARY_IMAGE_REPOSITORY}:${{ inputs.target_sha }}"
          registry_host="${STAGING_RENDER_CANARY_IMAGE_REPOSITORY%%/*}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "registry_host=${registry_host}" >> "${GITHUB_OUTPUT}"

      - name: Build and push staging canary image
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${{ steps.image.outputs.registry_host }}" --quiet
          docker build \
            -f scripts/render/staging-cloud-run-remotion-canary/Dockerfile \
            -t "${{ steps.image.outputs.image }}" \
            .
          docker push "${{ steps.image.outputs.image }}"

      - name: Deploy private staging canary service
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy '${{ inputs.service_name }}' \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --image "${{ steps.image.outputs.image }}" \
            --service-account "${GCP_SERVICE_ACCOUNT}" \
            --no-allow-unauthenticated \
            --memory="${STAGING_RENDER_CANARY_MEMORY}" \
            --cpu="${STAGING_RENDER_CANARY_CPU}" \
            --concurrency="${STAGING_RENDER_CANARY_CONCURRENCY}" \
            --max-instances=1 \
            --timeout=300 \
            --set-env-vars "STAGING_RENDER_CANARY_MODE=staging_real_video_upload_preview_canary,GCP_PROJECT_ID=${GCP_PROJECT_ID},GCP_REGION=${GCP_REGION},GOOGLE_CLOUD_PROJECT=${GCP_PROJECT_ID},STAGING_RENDER_CANARY_OUTPUT_BUCKET_OR_PREFIX=${STAGING_RENDER_CANARY_OUTPUT_BUCKET_OR_PREFIX},STAGING_RENDER_CANARY_EXPECTED_HOST_SUFFIX=.run.app,STAGING_RENDER_CANARY_TIMEOUT_SECONDS=${STAGING_RENDER_CANARY_TIMEOUT_SECONDS},STAGING_RENDER_CANARY_MAX_ARTIFACT_BYTES=750000,STAGING_RENDER_CANARY_MEMORY=${STAGING_RENDER_CANARY_MEMORY},STAGING_RENDER_CANARY_CPU=${STAGING_RENDER_CANARY_CPU},STAGING_RENDER_CANARY_CONCURRENCY=${STAGING_RENDER_CANARY_CONCURRENCY},NODE_OPTIONS=${STAGING_RENDER_CANARY_NODE_OPTIONS}" \
            --quiet

      - name: Report deployed revision
        shell: bash
        run: |
          set -euo pipefail
          service_json="$(mktemp)"
          policy_json="$(mktemp)"
          gcloud run services describe '${{ inputs.service_name }}' \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --format=json > "${service_json}"
          gcloud run services get-iam-policy '${{ inputs.service_name }}' \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --format=json > "${policy_json}"

          python - "${service_json}" "${policy_json}" "${{ steps.before.outputs.revision }}" "${{ steps.image.outputs.image }}" "${GCP_PROJECT_ID}" "${GCP_REGION}" "${STAGING_RENDER_CANARY_OUTPUT_BUCKET_OR_PREFIX}" "${STAGING_RENDER_CANARY_MEMORY}" "${STAGING_RENDER_CANARY_CPU}" "${STAGING_RENDER_CANARY_CONCURRENCY}" "${STAGING_RENDER_CANARY_NODE_OPTIONS}" <<'PY'
          import json
          import sys

          service_path, policy_path, before_revision, expected_image, project_id, region, output_prefix, memory, cpu, concurrency, node_options = sys.argv[1:]
          service = json.load(open(service_path, encoding='utf-8'))
          policy = json.load(open(policy_path, encoding='utf-8'))
          latest_revision = service.get('status', {}).get('latestReadyRevisionName')
          status_url = service.get('status', {}).get('url')
          template = service.get('spec', {}).get('template', {})
          spec = template.get('spec', {})
          containers = spec.get('containers') or []
          container = containers[0] if containers else {}
          resources = container.get('resources', {})
          limits = resources.get('limits', {})
          env = {item.get('name'): item.get('value') for item in container.get('env', [])}
          annotations = template.get('metadata', {}).get('annotations', {})
          bindings = policy.get('bindings', [])
          members = [member for binding in bindings for member in binding.get('members', [])]

          checks = {
              'revision_changed': latest_revision and latest_revision != before_revision,
              'image_matches_target_sha': container.get('image') == expected_image,
              'status_url_matches_github_vars': status_url == 'https://reeditpro-staging-render-canary-4wkjiqvdqa-ue.a.run.app',
              'service_private': 'allUsers' not in members and 'allAuthenticatedUsers' not in members,
              'memory_2gi': limits.get('memory') == memory,
              'cpu_2': limits.get('cpu') == cpu,
              'concurrency_1': str(spec.get('containerConcurrency')) == concurrency,
              'max_instances_1': annotations.get('autoscaling.knative.dev/maxScale') == '1',
              'timeout_300': str(spec.get('timeoutSeconds')) == '300',
              'project_env': env.get('GCP_PROJECT_ID') == project_id,
              'region_env': env.get('GCP_REGION') == region,
              'google_cloud_project_env': env.get('GOOGLE_CLOUD_PROJECT') == project_id,
              'node_options_env': env.get('NODE_OPTIONS') == node_options,
              'output_bucket_env': env.get('STAGING_RENDER_CANARY_OUTPUT_BUCKET_OR_PREFIX') == output_prefix,
          }
          failed = [name for name, ok in checks.items() if not ok]
          summary = {
              'latestReadyRevisionName': latest_revision,
              'previousReadyRevisionName': before_revision,
              'statusUrl': status_url,
              'image': container.get('image'),
              'checks': checks,
          }
          print(json.dumps(summary, indent=2, sort_keys=True))
          if failed:
              raise SystemExit('Cloud Run deploy verification failed: ' + ', '.join(failed))
          PY
