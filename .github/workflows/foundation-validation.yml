      - codex/rp-foundation-20a-local-supabase-toolchain-repair
      - codex/rp-foundation-20c-local-supabase-environment-manual-setup
      - codex/rp-foundation-20d-manual-environment-setup-verification
      - codex/rp-foundation-20e-local-supabase-manual-setup-follow-up
