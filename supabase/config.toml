# ReeditPro local-only Supabase configuration.
# Not linked to remote Supabase; contains no credentials.
# Do not replace these values with production values.
# Future disposable local apply must verify the local target before any Supabase CLI command.
# Future target project remains reeditpro; this local target uses reeditpro-local.

project_id = "reeditpro-local"

[api]
enabled = true
port = 55431
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55432
shadow_port = 55430
major_version = 15

[db.pooler]
enabled = false
port = 55439
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true
ip_version = "IPv4"

[studio]
enabled = true
port = 55433
api_url = "http://127.0.0.1:55431"

[inbucket]
enabled = true
port = 55434
smtp_port = 55435
pop3_port = 55436

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
max_frequency = "1m"
otp_length = 6
otp_expiry = 3600

[edge_runtime]
enabled = false
policy = "oneshot"
inspector_port = 55438

[analytics]
enabled = false
port = 55437
backend = "postgres"
