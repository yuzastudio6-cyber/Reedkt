name: Internal Tester Google Profile Workspace Provisioning

on:
  workflow_dispatch:
    inputs:
      confirm_internal_tester_provisioning:
        description: "Type PROVISION_REEDITPRO_INTERNAL_TESTER"
        required: true
        type: string
      allow_staging_writes:
        description: "Acknowledge bounded staging profile/workspace writes"
        required: true
        default: false
        type: boolean
      source_ref:
        description: "Exact reviewed source branch"
        required: true
        default: "codex/backend-workflow-pipeline-continuation"
        type: string
      source_sha:
        description: "Exact reviewed source SHA"
        required: true
        type: string
      expected_email_hash:
        description: "16-character hash emitted by the owner-interactive Google verifier"
        required: true
        type: string
      display_name:
        description: "Optional bounded tester display name"
        required: false
        type: string
      workspace_name:
        description: "Optional bounded internal-testing workspace name"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: internal-tester-google-profile-workspace-provisioning
  cancel-in-progress: false

jobs:
  provision-internal-tester:
    name: Provision prior Google tester profile and workspace
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      REEDITPRO_CONFIRM_INTERNAL_TESTER_PROVISIONING: ${{ inputs.confirm_internal_tester_provisioning }}
      REEDITPRO_CONFIRM_STAGING_SUPABASE_WRITES: ${{ inputs.allow_staging_writes && 'true' || 'false' }}
      SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      INTERNAL_TESTER_EMAIL: ${{ secrets.STAGING_INTERNAL_TESTER_EMAIL }}
      INTERNAL_TESTER_EXPECTED_EMAIL_HASH: ${{ inputs.expected_email_hash }}
      INTERNAL_TESTER_DISPLAY_NAME: ${{ inputs.display_name }}
      INTERNAL_TESTER_WORKSPACE_NAME: ${{ inputs.workspace_name }}
    steps:
      - name: Fail closed unless exact Google-first staging provisioning is approved
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "${REEDITPRO_CONFIRM_INTERNAL_TESTER_PROVISIONING}" = "PROVISION_REEDITPRO_INTERNAL_TESTER"
          test "${REEDITPRO_CONFIRM_STAGING_SUPABASE_WRITES}" = "true"
          test "${SOURCE_REF}" = "codex/backend-workflow-pipeline-continuation"
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "${GITHUB_REF}" = "refs/heads/${SOURCE_REF}"
          test "${GITHUB_SHA}" = "${SOURCE_SHA}"
          [[ "${INTERNAL_TESTER_EXPECTED_EMAIL_HASH}" =~ ^[0-9a-f]{16}$ ]]
          test -n "${SUPABASE_URL}"
          test -n "${SUPABASE_SERVICE_ROLE_KEY}"
          test -n "${INTERNAL_TESTER_EMAIL}"
          actual_email_hash="$(printf '%s' "${INTERNAL_TESTER_EMAIL}" | tr '[:upper:]' '[:lower:]' | sha256sum | cut -c1-16)"
          test "${actual_email_hash}" = "${INTERNAL_TESTER_EXPECTED_EMAIL_HASH}"

      - name: Checkout exact reviewed source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1

      - name: Verify immutable source tip and clean write context
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          test -z "$(git status --porcelain)"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install immutable dependencies
        run: npm ci --no-audit --no-fund --progress=false

      - name: Verify Google-first provisioning source boundaries
        run: |
          set -euo pipefail
          npm run smoke:internal-tester-profile-workspace-provisioning
          npm run check:frontend-boundary
          npm run check:secrets

      - name: Provision existing Google tester identity
        run: npm run internal-testing:provision-tester

      - name: Record the readback gate
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '# ReEditPro Google Tester Provisioning'
            echo ''
            echo '- An existing Google-linked Auth user with confirmed email and a prior Auth sign-in was required before any profile/workspace write.'
            echo '- No Auth user, invitation, password, migration, Storage object, provider call, worker, render, credit, billing, beta, or production authority was created.'
            echo '- Run Internal Tester Google Auth Readback for this exact SHA and email hash, then rerun the owner-interactive Google session verifier.'
          } >> "${GITHUB_STEP_SUMMARY}"
