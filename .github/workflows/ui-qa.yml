name: UI QA

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - 'codex/**'
      - 'feature/**'

jobs:
  ui-qa:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check repository for committed secrets
        run: npm run check:secrets

      - name: Check reachable branch history for committed secrets
        run: npm run check:secrets:history

      - name: Install dependencies
        run: npm ci

      - name: Check frontend/server boundary
        run: npm run check:frontend-boundary

      - name: Block high or critical production dependency vulnerabilities
        run: npm run audit:prod:high

      - name: Moderate dependency audit report
        continue-on-error: true
        run: npm run audit:prod

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Install private-pipeline media runtime
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo env DEBIAN_FRONTEND=noninteractive timeout 300s apt-get update \
              -o Acquire::Retries=3 -o Acquire::http::Timeout=30
            sudo env DEBIAN_FRONTEND=noninteractive timeout 300s apt-get install --yes ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Browser E2E
        run: npm run test:e2e

      - name: Server typecheck
        run: npm run typecheck:server

      - name: Security boundary smokes
        run: |
          npm run smoke:runtime-api-security
          npm run smoke:auth-runtime-boundary
          npm run smoke:edit-execution-security-boundary
          npm run smoke:idempotency-boundary
          npm run smoke:upload-boundary-security
          npm run smoke:gcs-upload-integrity-security
          npm run smoke:error-provider-confidentiality
          npm run smoke:private-local-persistence
          npm run smoke:supabase-security

      - name: Install canonical private-pipeline database runtime
        uses: supabase/setup-cli@v1
        with:
          version: 2.105.0

      - name: Verify canonical private-pipeline database runtime
        run: |
          supabase --version
          psql --version
          jq --version

      - name: Authenticated private pipeline E2E
        run: npm run qa:internal-pipeline

      - name: Write QA summary
        if: always()
        run: |
          {
            echo "## ReeditPro UI QA"
            echo ""
            echo "- Lint, frontend/server typechecks, build, and mocked Chromium E2E are run in this workflow."
            echo "- The authenticated private pipeline then proves backend upload, approval, private render, manifest QA, revision, recovery, and private download with generated test media."
            echo "- External beta, public delivery, provider execution, and paid production remain controlled by separate release gates."
            echo "- Frontend/server dependency boundary check is enforced before browser QA."
            echo "- High and critical production dependency advisories block CI; remaining moderate advisories are reported and tracked."
            echo "- Runtime auth, worker execution, idempotency, upload/GCS integrity, error confidentiality, local private-file, and Supabase security smokes are enforced."
            echo "- Viewport coverage: 1024, 1280, 1440, 1728, and 1920 via Playwright."
            echo "- Approval failure coverage uses /editor?qaApprovalFailure=1, guarded by DEV or VITE_REEDITPRO_E2E=true."
            echo "- Screenshot artifacts are generated by the E2E screenshot spec under docs/ui-ux-screenshots/."
            echo "- Review the Build step output for Vite chunk warning status."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/e2e
          if-no-files-found: ignore

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-ux-screenshots
          path: docs/ui-ux-screenshots
          if-no-files-found: ignore
