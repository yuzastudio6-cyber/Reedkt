name: Foundation Validation

on:
  pull_request:
    branches:
      - codex/rp-activation-53a-runtime-unlock-roadmap-owner-acceptance-audit
      - codex/rp-gd-0-ai-tools-creative-graphics-repo-audit
      - codex/rp-gd-1-ai-tools-creative-graphics-manifest-contract
      - codex/rp-gd-2-ai-tools-creative-graphics-dry-run-fixture-pack
      - codex/rp-gd-3-ai-tools-creative-graphics-generated-local-fixture-candidates
      - codex/rp-gd-4-ai-tools-creative-graphics-static-fixture-gate-review
      - codex/rp-gd-5-ai-tools-creative-graphics-controlled-fixture-execution-plan
      - codex/rp-gd-6-ai-tools-creative-graphics-execution-approval-gate
      - codex/rp-gd-7-ai-tools-creative-graphics-controlled-local-fixture-execution
      - codex/rp-gd-8-ai-tools-creative-graphics-package-runtime-enablement
      - codex/rp-gd-8a-ai-tools-creative-graphics-package-runtime-fixes
      - codex/rp-gd-7-retry-ai-tools-creative-graphics-controlled-local-fixture-execution
      - codex/rp-tracka-gd-handoff-0-creative-graphics-review
      - codex/rp-tracka-gd-handoff-1-private-preview-composition-plan
      - codex/rp-tracka-gd-handoff-2-controlled-private-preview-execution-packet
      - codex/rp-tracka-gd-handoff-3-controlled-private-preview-execution
      - codex/rp-tracka-gd-handoff-3a-source-artifact-preservation-fix
      - codex/rp-tracka-gd-handoff-3-retry-controlled-private-preview-execution
      - codex/rp-tracka-gd-handoff-4-private-preview-qa-review
      - codex/rp-tracka-gd-handoff-5-controlled-private-sample-planning
      - codex/rp-tracka-gd-handoff-6-controlled-private-sample-execution
      - codex/rp-tracka-gd-handoff-7-controlled-private-sample-qa-internal-beta-readiness
      - codex/rp-cross-beta-0-cross-workstream-internal-beta-gate-review

jobs:
  foundation-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: GD-8A resvg native import probe
        run: node scripts/fixtures/ai-tools/probe-resvg-native-runtime.mjs

      - name: Foundation validation
        run: npm run foundation:validate

      - name: Foundation validation with build
        run: npm run foundation:validate:with-build

      - name: Server build
        run: npm run build:server
