name: Internal Tester Google Session Readiness

on:
  workflow_dispatch:
    inputs:
      confirm_google_session_readiness:
        description: "Type VERIFY_REEDITPRO_GOOGLE_SESSION_READINESS"
        required: true
        type: string
      source_ref:
        description: "Exact reviewed source branch"
        required: true
        default: "codex/backend-workflow-pipeline-continuation"
        type: string
      source_sha:
        description: "Exact reviewed source SHA deployed to the signed-in app"
        required: true
        type: string
      pages_deploy_run_id:
        description: "Successful App Signed-In Internal Testing Pages Deploy workflow run ID"
        required: true
        type: string
      hosted_app_url:
        description: "Exact reviewed hosted app base URL"
        required: true
        default: "https://yuzastudio6-cyber.github.io/Reedkt/"
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: internal-tester-google-session-readiness
  cancel-in-progress: false

jobs:
  verify-google-session-readiness:
    name: Verify credential-free hosted Google session readiness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      REEDITPRO_CONFIRM_HOSTED_SIGN_IN_ROUTE_READINESS: VERIFY_REEDITPRO_HOSTED_SIGN_IN_ROUTE
      REEDITPRO_EXPECT_HOSTED_SUPABASE_CONFIGURED: "true"
      REEDITPRO_HOSTED_APP_URL: ${{ inputs.hosted_app_url }}
    steps:
      - name: Fail closed unless this is the exact credential-free readiness lane
        shell: bash
        env:
          CONFIRM_GOOGLE_SESSION_READINESS: ${{ inputs.confirm_google_session_readiness }}
          SOURCE_REF: ${{ inputs.source_ref }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          PAGES_DEPLOY_RUN_ID: ${{ inputs.pages_deploy_run_id }}
        run: |
          set -euo pipefail
          test "${CONFIRM_GOOGLE_SESSION_READINESS}" = "VERIFY_REEDITPRO_GOOGLE_SESSION_READINESS"
          test "${SOURCE_REF}" = "codex/backend-workflow-pipeline-continuation"
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "${GITHUB_REF}" = "refs/heads/${SOURCE_REF}"
          test "${GITHUB_SHA}" = "${SOURCE_SHA}"
          [[ "${PAGES_DEPLOY_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          test "${REEDITPRO_HOSTED_APP_URL}" = "https://yuzastudio6-cyber.github.io/Reedkt/"

      - name: Checkout exact reviewed source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1

      - name: Verify immutable source tip and clean readiness context
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          test -z "$(git status --porcelain)"

      - name: Require successful same-SHA signed-in Pages deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ inputs.source_ref }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          PAGES_DEPLOY_RUN_ID: ${{ inputs.pages_deploy_run_id }}
        run: |
          set -euo pipefail
          deploy_run="${RUNNER_TEMP}/pages-deploy-run.json"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${PAGES_DEPLOY_RUN_ID}" > "${deploy_run}"
          python3 - \
            "${deploy_run}" \
            "${GITHUB_REPOSITORY}" \
            "${SOURCE_REF}" \
            "${SOURCE_SHA}" \
            "${PAGES_DEPLOY_RUN_ID}" <<'PY'
          import json
          import pathlib
          import sys

          run = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8") or "{}")
          repository = (run.get("repository") or {}).get("full_name")
          workflow_path = str(run.get("path") or "").split("@")[0]
          if repository != sys.argv[2]:
              raise SystemExit("Pages deployment evidence belongs to another repository.")
          if run.get("name") != "App Signed-In Internal Testing Pages Deploy":
              raise SystemExit("Pages deployment evidence has the wrong workflow name.")
          if workflow_path != ".github/workflows/app-internal-testing-pages-deploy.yml":
              raise SystemExit("Pages deployment evidence has the wrong workflow path.")
          if run.get("event") != "workflow_dispatch" or run.get("status") != "completed" or run.get("conclusion") != "success":
              raise SystemExit("The signed-in Pages deployment did not complete successfully.")
          if run.get("head_branch") != sys.argv[3] or run.get("head_sha") != sys.argv[4]:
              raise SystemExit("Pages deployment source does not match this readiness source exactly.")
          if run.get("id") != int(sys.argv[5]):
              raise SystemExit("Pages deployment run ID does not match the requested evidence.")
          PY

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install immutable dependencies
        run: npm ci --no-audit --no-fund --progress=false

      - name: Install Chromium for credential-free hosted route proof
        run: npx playwright install --with-deps chromium

      - name: Prove hosted and interactive-verifier source boundaries
        run: |
          set -euo pipefail
          npm run smoke:hosted-sign-in-route-readiness
          npm run smoke:app-sign-in-entrypoint
          npm run smoke:google-oauth-sign-in
          npm run smoke:internal-tester-interactive-google-session
          npm run smoke:internal-tester-browser-sign-in-verification
          npm run check:frontend-boundary
          npm run check:secrets

      - name: Verify deployed Google-first sign-in surface without credentials
        run: npm run internal-testing:verify-hosted-sign-in-route

      - name: Record the owner-interactive next gate
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '# ReEditPro Google Session Readiness'
            echo ''
            echo '- The exact same-SHA signed-in Pages deployment and hosted Google-first sign-in surface passed.'
            echo '- This CI run did not click Google, submit credentials, create a session, read browser storage, or claim Gmail sign-in success.'
            echo '- Run `npm run internal-testing:verify-interactive-google-session` on the owner desktop with the expected public Supabase and activation-evidence gateway origins.'
            echo '- That owner-local gate must pass callback, Google identity, reload, authenticated gateway readback, and sign-out before signed-in pipeline testing.'
          } >> "${GITHUB_STEP_SUMMARY}"
