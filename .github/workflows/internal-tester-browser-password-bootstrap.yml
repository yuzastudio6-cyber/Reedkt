name: Internal Tester Browser Password Bootstrap

on:
  workflow_dispatch:
    inputs:
      confirm_internal_tester_browser_password_bootstrap:
        description: "Type BOOTSTRAP_REEDITPRO_INTERNAL_TESTER_BROWSER_PASSWORD to create/update the staging tester password"
        required: true
        type: string
      allow_staging_writes:
        description: "Required safety gate for staging Auth password writes"
        required: true
        default: false
        type: boolean
      tester_email:
        description: "Internal tester email address"
        required: true
        type: string
      display_name:
        description: "Optional display name for Auth metadata"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: internal-tester-browser-password-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap-browser-password:
    name: Bootstrap staging tester browser password
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REEDITPRO_CONFIRM_INTERNAL_TESTER_BROWSER_PASSWORD_BOOTSTRAP: ${{ inputs.confirm_internal_tester_browser_password_bootstrap }}
      REEDITPRO_CONFIRM_STAGING_SUPABASE_WRITES: ${{ inputs.allow_staging_writes && 'true' || 'false' }}
      SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      INTERNAL_TESTER_EMAIL: ${{ inputs.tester_email }}
      INTERNAL_TESTER_DISPLAY_NAME: ${{ inputs.display_name }}
      INTERNAL_TESTER_PASSWORD: ${{ secrets.STAGING_INTERNAL_TESTER_PASSWORD }}
    steps:
      - name: Fail closed unless browser password bootstrap is explicitly approved
        shell: bash
        run: |
          set -euo pipefail
          test "${REEDITPRO_CONFIRM_INTERNAL_TESTER_BROWSER_PASSWORD_BOOTSTRAP}" = "BOOTSTRAP_REEDITPRO_INTERNAL_TESTER_BROWSER_PASSWORD"
          test "${REEDITPRO_CONFIRM_STAGING_SUPABASE_WRITES}" = "true"
          test -n "${SUPABASE_URL}"
          test -n "${SUPABASE_SERVICE_ROLE_KEY}"
          if [ -z "${INTERNAL_TESTER_PASSWORD}" ]; then
            echo "::error::Add GitHub secret STAGING_INTERNAL_TESTER_PASSWORD before running password bootstrap."
            exit 1
          fi
          if ! [[ "${INTERNAL_TESTER_EMAIL}" =~ ^[^[:space:]@]+@[^[:space:]@]+\.[^[:space:]@]+$ ]]; then
            echo "::error::tester_email must be an email address."
            exit 1
          fi

      - name: Checkout app source
        uses: actions/checkout@v5
        with:
          ref: codex/reeditpro-web-ui-shell
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies for backend-only Auth CLI
        run: npm ci --no-audit --no-fund --progress=false

      - name: Bootstrap internal tester browser password
        run: npm run internal-testing:bootstrap-tester-password
