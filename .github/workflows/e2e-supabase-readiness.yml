name: RP E2E Supabase Readiness

on:
  pull_request:
  workflow_dispatch:
    inputs:
      supabase_mode:
        description: "Supabase table smoke mode. Live mode requires repository secrets."
        required: true
        default: "disabled"
        type: choice
        options:
          - disabled
          - live

jobs:
  supabase-readiness:
    runs-on: ubuntu-latest
    env:
      API_ALLOW_MOCK_WITHOUT_SUPABASE: "true"
      E2E_RUNTIME_MODE: local
      WORKER_RUNTIME_MODE: local
      STORAGE_MODE: local
      SUPABASE_E2E_SMOKE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.supabase_mode || 'disabled' }}
      SUPABASE_E2E_ALLOW_WRITES: "false"
      SUPABASE_E2E_CLEANUP: "true"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Build API
        run: npm run build:api

      - name: Typecheck API
        run: npm run typecheck:api

      - name: Migration manifest check
        run: npm run smoke:supabase:migration-manifest

      - name: Migration manifest disabled-mode test
        run: npm run smoke:supabase:migration-manifest:test

      - name: Supabase live env check
        run: npm run smoke:supabase:live-env

      - name: Supabase live env disabled-mode test
        run: npm run smoke:supabase:live-env:test

      - name: Supabase table readiness smoke
        run: npm run smoke:supabase:tables

      - name: Supabase RPC readiness smoke
        run: npm run smoke:supabase:rpcs

      - name: Supabase RLS/auth audit
        run: npm run smoke:supabase:rls-auth

      - name: Supabase RLS/auth disabled-mode test
        run: npm run smoke:supabase:rls-auth:test

      - name: Supabase live write guard test
        run: npm run smoke:supabase:write-guard:test

      - name: Supabase RPC readiness disabled-mode test
        run: npm run smoke:supabase:rpcs:test

      - name: RPC persisted render disabled-mode test
        run: npm run smoke:e2e:rpc-persisted-render:test

      - name: Supabase full flow disabled-mode test
        run: npm run smoke:e2e:supabase-full:test

      - name: E2E readiness summary
        run: npm run e2e:readiness

      - name: E2E readiness summary test
        run: npm run smoke:e2e:readiness:test
