steps:
  - name: gcr.io/google.com/cloudsdktool/google-cloud-cli@sha256:38b6345faa0554a3bfae9a79f175379cc8e95d2290dd7070848e2f8497e62428
    id: reread-exact-official-source
    entrypoint: bash
    args:
      - -ceu
      - |
        mkdir -p private-staging
        gcloud storage cp \
          --if-generation-match=1786071963625032 \
          gs://reeditpro-production-reeditpro-model-artifacts/private/model-artifacts/sam3_1/source/96914d2425f90a64f45ca977c2b5165418099543/sam31-weeditpro-official-ingest-20260806-v12-bb0aa9fdb01770a4/sam3-96914d2425f90a64f45ca977c2b5165418099543.tar \
          private-staging/sam3-source.tar
        test "$$(stat --format='%s' private-staging/sam3-source.tar)" = 73605120
        printf '%s  %s\n' \
          5138f0e396de40a40ef0168c106e089aacbbf1dc7651be2f81c76f89c2f67f2a \
          private-staging/sam3-source.tar | sha256sum --check --strict
  - name: gcr.io/cloud-builders/docker@sha256:f8b08c609fdc392ee6827ff3e1725e4980f7d96bde9f76f4695086405c96c147
    id: build-fixed-qualification-capsule
    waitFor:
      - reread-exact-official-source
    entrypoint: bash
    args:
      - -ceu
      - |
        docker build \
          --pull=false \
          --no-cache \
          --platform=linux/amd64 \
          --build-arg=WEEDITPRO_REPOSITORY_COMMIT=${_REPOSITORY_COMMIT} \
          --build-arg=WEEDITPRO_REPOSITORY_TREE=${_REPOSITORY_TREE} \
          --file=Dockerfile.qualification-capsule-builder \
          --tag=weeditpro-sam31-qualification-capsule:source-bound-v1 \
          .
        container_id="$$(docker create \
          weeditpro-sam31-qualification-capsule:source-bound-v1)"
        trap 'docker rm --force "$${container_id}" >/dev/null 2>&1 || true' EXIT
        mkdir -p /workspace/private-capsule-output
        docker cp "$${container_id}:/output/." /workspace/private-capsule-output/
        test "$$(find /workspace/private-capsule-output -maxdepth 1 \
          -type f -name '*.tar.gz' | wc -l)" = 1
        test "$$(find /workspace/private-capsule-output -maxdepth 1 \
          -type f -name '*.capsule.json' | wc -l)" = 1
        docker rm "$${container_id}" >/dev/null
        trap - EXIT
artifacts:
  objects:
    location: gs://reeditpro-production-reeditpro-image-build-inputs/private/image-build-inputs/sam3_1/qualification/reproducibility/${BUILD_ID}/
    paths:
      - private-capsule-output/*.tar.gz
      - private-capsule-output/*.capsule.json
timeout: 3600s
queueTtl: 600s
serviceAccount: projects/reeditpro/serviceAccounts/reeditpro-image-builder-sa@reeditpro.iam.gserviceaccount.com
options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: '200'
  logging: CLOUD_LOGGING_ONLY
  requestedVerifyOption: VERIFIED
  sourceProvenanceHash:
    - SHA256
tags:
  - weeditpro
  - sam3-1
  - qualification-capsule-build
